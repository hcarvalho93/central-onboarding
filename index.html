<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Central de Onboarding · Trinus</title>
<style>
/* ============================================================
   CENTRAL INTELIGENTE DE CONTROLE DE ONBOARDING — TRINUS
   Aplicação única (HTML + CSS + JS puro). Sem dependências.
   Persistência: localStorage. Base: aba "Controle" da planilha.
   ============================================================ */

:root{
  /* Marca Trinus (amostradas do logotipo oficial) */
  --azul:#1A6EE8;        /* Azul Conexão  */
  --ciano:#0FE4F5;       /* Ciano Horizonte */
  --oceano:#1A3EB5;      /* Azul Oceano */
  --navy:#0C1B3F;        /* Institucional profundo */
  --navy-2:#132650;
  /* Neutros */
  --papel:#F4F6FA;
  --branco:#FFFFFF;
  --tinta:#152139;
  --tinta-2:#4A5C7A;
  --tinta-3:#7C8CA6;
  --linha:#E1E7F0;
  --linha-2:#EDF1F7;
  /* Farol — uso exclusivo de sinalização operacional */
  --verde:#0E8A5F;  --verde-bg:#E6F5EF;
  --ambar:#B57500;  --ambar-bg:#FDF3E0;
  --vermelho:#C9304B; --vermelho-bg:#FBEAEE;
  --critico:#7C1230; --critico-bg:#F6E3E8;
  --azul-bg:#E9F1FE;
  --r:6px;
  --sombra:0 1px 2px rgba(12,27,63,.06), 0 6px 20px rgba(12,27,63,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--papel); color:var(--tinta);
  font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:640;letter-spacing:-.01em}
a{color:var(--azul)}
::selection{background:#CDE3FF}
:focus-visible{outline:2px solid var(--azul);outline-offset:2px;border-radius:3px}

/* ---------- Estrutura ---------- */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.rail{background:var(--navy);color:#C6D3EA;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.rail__logo{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.09)}
.rail__logo img{width:118px;display:block;filter:brightness(0) invert(1)}
.rail__logo span{display:block;margin-top:9px;font-size:11px;letter-spacing:.06em;color:#7E93B8}
.rail nav{padding:12px 10px;flex:1;overflow:auto}
.nav-b{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:none;border:0;color:#B9C8E2;padding:9px 11px;border-radius:var(--r);
  cursor:pointer;font-size:13.5px;position:relative
}
.nav-b:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-b.on{background:rgba(26,110,232,.22);color:#fff;font-weight:600}
.nav-b.on::before{content:"";position:absolute;left:-10px;top:6px;bottom:6px;width:3px;background:var(--ciano);border-radius:0 3px 3px 0}
.nav-b .ic{width:17px;text-align:center;opacity:.85;font-size:14px}
.nav-b .cnt{margin-left:auto;font-size:11px;background:rgba(255,255,255,.13);padding:1px 6px;border-radius:9px}
.nav-b .cnt.alerta{background:var(--vermelho);color:#fff}
.rail__foot{padding:12px 14px;border-top:1px solid rgba(255,255,255,.09);font-size:11px;color:#6F84A8}
.rail__foot button{background:none;border:0;color:#8FA6C9;cursor:pointer;padding:2px 0;display:block;font-size:11.5px}
.rail__foot button:hover{color:#fff;text-decoration:underline}

.main{min-width:0;display:flex;flex-direction:column}
.top{
  background:var(--branco);border-bottom:1px solid var(--linha);
  padding:14px 26px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:40
}
.top h1{font-size:17px}
.top h1 small{display:block;font-size:12px;font-weight:400;color:var(--tinta-3);letter-spacing:0}
.busca{margin-left:auto;position:relative;width:min(360px,42vw)}
.busca input{width:100%;padding:8px 12px 8px 32px;border:1px solid var(--linha);border-radius:var(--r);background:var(--papel)}
.busca input:focus{background:#fff;border-color:var(--azul);outline:none;box-shadow:0 0 0 3px rgba(26,110,232,.12)}
.busca::before{content:"⌕";position:absolute;left:11px;top:6px;color:var(--tinta-3);font-size:16px}
.view{padding:22px 26px 60px;flex:1}

/* ---------- Componentes ---------- */
.bloco{background:var(--branco);border:1px solid var(--linha);border-radius:8px;box-shadow:var(--sombra)}
.bloco__h{padding:13px 16px;border-bottom:1px solid var(--linha-2);display:flex;align-items:center;gap:10px}
.bloco__h h2{font-size:14.5px}
.bloco__h p{margin:0;font-size:12px;color:var(--tinta-3)}
.bloco__h .dir{margin-left:auto;display:flex;gap:8px;align-items:center}
.bloco__b{padding:16px}
.grid{display:grid;gap:16px}
.sec-tit{font-size:12px;color:var(--tinta-3);margin:26px 0 10px;font-weight:600;letter-spacing:.02em}
.sec-tit:first-child{margin-top:0}

.btn{background:var(--branco);border:1px solid var(--linha);border-radius:var(--r);padding:7px 12px;cursor:pointer;font-size:13px;color:var(--tinta)}
.btn:hover{border-color:#B9C9E4;background:#FAFCFF}
.btn--p{background:var(--azul);border-color:var(--azul);color:#fff;font-weight:560}
.btn--p:hover{background:#1560D0;border-color:#1560D0}
.btn--g{background:var(--navy);border-color:var(--navy);color:#fff}
.btn--sm{padding:4px 9px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* Cartões-indicadores do painel */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:10px}
.kpi{background:var(--branco);border:1px solid var(--linha);border-left:3px solid var(--linha);border-radius:var(--r);padding:11px 13px;cursor:pointer;text-align:left}
.kpi:hover{border-color:#C4D3EB;border-left-color:var(--azul);background:#FCFDFF}
.kpi.on{border-left-color:var(--azul);background:var(--azul-bg);border-color:#BBD5FA}
.kpi b{display:block;font-size:23px;font-weight:660;letter-spacing:-.02em;line-height:1.15}
.kpi span{font-size:11.5px;color:var(--tinta-2);display:block;margin-top:2px}
.kpi.v b{color:var(--verde)} .kpi.a b{color:var(--ambar)}
.kpi.r b{color:var(--vermelho)} .kpi.c b{color:var(--critico)}

/* Farol */
.farol{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap}
.farol i{width:7px;height:7px;border-radius:50%;background:currentColor;font-style:normal}
.f-verde{color:var(--verde);background:var(--verde-bg)}
.f-ambar{color:var(--ambar);background:var(--ambar-bg)}
.f-vermelho{color:var(--vermelho);background:var(--vermelho-bg)}
.f-critico{color:var(--critico);background:var(--critico-bg)}
.f-pausado{color:var(--tinta-2);background:#EEF1F6}

/* Etiquetas */
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:4px;background:var(--linha-2);color:var(--tinta-2);white-space:nowrap}
.tag--az{background:var(--azul-bg);color:var(--oceano)}
.tag--vm{background:var(--vermelho-bg);color:var(--vermelho)}
.tag--am{background:var(--ambar-bg);color:var(--ambar)}
.tag--vd{background:var(--verde-bg);color:var(--verde)}
.resp{font-size:11.5px;color:var(--tinta-2)}
.resp--cli{color:var(--oceano);font-weight:600}

/* Tabelas */
.tab-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{
  text-align:left;font-size:11.5px;font-weight:600;color:var(--tinta-3);
  padding:9px 12px;border-bottom:1px solid var(--linha);white-space:nowrap;background:#FBFCFE;position:sticky;top:0
}
table.t td{padding:10px 12px;border-bottom:1px solid var(--linha-2);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t tbody tr:hover{background:#F8FAFE;cursor:pointer}
table.t .num{text-align:right;font-variant-numeric:tabular-nums}
.cli-nome{font-weight:600;color:var(--tinta);display:block;line-height:1.3}
.cli-sub{font-size:11.5px;color:var(--tinta-3)}
.vazio{padding:36px 16px;text-align:center;color:var(--tinta-3);font-size:13px}
.vazio b{display:block;color:var(--tinta-2);font-size:14px;margin-bottom:3px}

/* Prioridade */
.pri{font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px;letter-spacing:.02em}
.pri-critica{background:var(--critico);color:#fff}
.pri-alta{background:var(--vermelho-bg);color:var(--vermelho)}
.pri-media{background:var(--ambar-bg);color:var(--ambar)}
.pri-baixa{background:var(--linha-2);color:var(--tinta-2)}
.score{display:inline-block;min-width:26px;text-align:center;font-weight:700;font-size:12px;padding:2px 6px;border-radius:4px;background:var(--linha-2);color:var(--tinta-2)}
.score.hi{background:var(--critico);color:#fff}
.score.md{background:var(--vermelho-bg);color:var(--vermelho)}

/* Filtros */
.filtros{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.filtros select,.filtros input{padding:6px 9px;border:1px solid var(--linha);border-radius:var(--r);background:#fff;font-size:12.5px;max-width:190px}
.chip{border:1px solid var(--linha);background:#fff;border-radius:20px;padding:5px 11px;font-size:12px;cursor:pointer;color:var(--tinta-2)}
.chip:hover{border-color:#B9C9E4}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:560}
.limpar{margin-left:auto;font-size:12px;color:var(--azul);background:none;border:0;cursor:pointer}

/* Kanban */
.kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:14px}
.col{flex:0 0 262px;background:#EFF2F7;border-radius:8px;display:flex;flex-direction:column;max-height:74vh}
.col__h{padding:10px 12px;font-size:12px;font-weight:640;color:var(--tinta-2);border-bottom:1px solid #E2E7EF;display:flex;gap:6px}
.col__h b{margin-left:auto;color:var(--tinta-3);font-weight:600}
.col__b{padding:9px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.kcard{background:#fff;border:1px solid var(--linha);border-left:3px solid var(--linha);border-radius:var(--r);padding:9px 11px;cursor:pointer}
.kcard:hover{box-shadow:var(--sombra)}
.kcard.k-verde{border-left-color:var(--verde)} .kcard.k-ambar{border-left-color:var(--ambar)}
.kcard.k-vermelho{border-left-color:var(--vermelho)} .kcard.k-critico{border-left-color:var(--critico)}
.kcard.k-pausado{border-left-color:#B7C1D2}
.kcard h4{font-size:12.5px;line-height:1.3;margin-bottom:5px}
.kcard .kmeta{font-size:11px;color:var(--tinta-3);display:flex;gap:6px;flex-wrap:wrap;margin-bottom:5px}
.kcard .kpend{font-size:11.5px;color:var(--tinta-2);border-top:1px dashed var(--linha);padding-top:5px;margin-top:5px}
.kcard .kacao{font-size:11.5px;color:var(--oceano);font-weight:560;margin-top:3px}

/* Alertas */
.alerta{display:flex;gap:11px;padding:11px 14px;border-bottom:1px solid var(--linha-2);cursor:pointer;align-items:flex-start}
.alerta:hover{background:#F8FAFE}
.alerta:last-child{border-bottom:0}
.alerta .pt{width:9px;height:9px;border-radius:50%;margin-top:5px;flex:0 0 auto}
.alerta .txt{flex:1;min-width:0}
.alerta .txt b{font-weight:600}
.alerta .txt span{display:block;font-size:12px;color:var(--tinta-2)}
.alerta .qd{font-size:11.5px;color:var(--tinta-3);white-space:nowrap}

/* Painel do cliente */
.drawer{position:fixed;inset:0;background:rgba(12,27,63,.42);z-index:100;display:none}
.drawer.on{display:block}
.drawer__p{
  position:absolute;right:0;top:0;bottom:0;width:min(1040px,96vw);background:var(--papel);
  overflow-y:auto;box-shadow:-14px 0 40px rgba(12,27,63,.2);animation:slide .18s ease-out
}
@keyframes slide{from{transform:translateX(26px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.drawer__p{animation:none}}
.dh{background:var(--navy);color:#fff;padding:18px 24px}
.dh h2{font-size:18px;padding-right:40px;line-height:1.3}
.dh .meta{margin-top:7px;display:flex;flex-wrap:wrap;gap:7px;align-items:center;font-size:12px;color:#AFC1DE}
.dh .meta .tag{background:rgba(255,255,255,.12);color:#DCE7F8}
.dh .fechar{position:absolute;right:16px;top:16px;background:rgba(255,255,255,.12);border:0;color:#fff;width:30px;height:30px;border-radius:var(--r);cursor:pointer;font-size:16px}
.dh .fechar:hover{background:rgba(255,255,255,.24)}
.dh .resumo{display:flex;flex-wrap:wrap;gap:20px;margin-top:15px;padding-top:14px;border-top:1px solid rgba(255,255,255,.12)}
.dh .resumo div{min-width:104px}
.dh .resumo small{display:block;font-size:11px;color:#8FA6C9;margin-bottom:2px}
.dh .resumo b{font-size:14px;font-weight:600}
.db{padding:20px 24px 70px}
.acoes{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px}

/* Linha do tempo */
.timeline{display:flex;gap:0;overflow-x:auto;padding:6px 0 2px}
.tl{flex:1;min-width:104px;position:relative;padding:0 6px;text-align:center}
.tl::after{content:"";position:absolute;top:13px;left:50%;width:100%;height:2px;background:var(--linha)}
.tl:last-child::after{display:none}
.tl .bola{
  width:27px;height:27px;border-radius:50%;background:#fff;border:2px solid var(--linha);
  display:flex;align-items:center;justify-content:center;margin:0 auto 7px;position:relative;z-index:2;
  font-size:12px;color:var(--tinta-3);font-weight:700
}
.tl.ok .bola{background:var(--verde);border-color:var(--verde);color:#fff}
.tl.now .bola{border-color:var(--azul);color:var(--azul);box-shadow:0 0 0 4px rgba(26,110,232,.15)}
.tl.late .bola{background:var(--vermelho);border-color:var(--vermelho);color:#fff}
.tl small{display:block;font-size:11px;color:var(--tinta-2);line-height:1.3}
.tl.now small{color:var(--azul);font-weight:640}
.tl .dt{font-size:10.5px;color:var(--tinta-3);margin-top:2px}

/* Checklist operacional */
.chk{display:grid;grid-template-columns:repeat(auto-fill,minmax(224px,1fr));gap:9px}
.ck{border:1px solid var(--linha);border-radius:var(--r);padding:10px 12px;background:#fff}
.ck .lab{font-size:11.5px;color:var(--tinta-3)}
.ck .val{font-weight:600;font-size:13px;margin-top:2px;display:flex;align-items:center;gap:6px}
.ck .raw{font-size:11.5px;color:var(--tinta-2);margin-top:4px;word-break:break-word;border-top:1px dashed var(--linha);padding-top:4px}
.ck.e-Concluído{border-left:3px solid var(--verde)}
.ck.e-Pendente{border-left:3px solid var(--vermelho)}
.ck.e-Parcial,.ck.e-Emandamento{border-left:3px solid var(--ambar)}
.ck.e-Averificar{border-left:3px solid var(--azul)}
.ck.e-Nãoaplicável,.ck.e-Nãoinformado{border-left:3px solid var(--linha)}

/* Formulário de datas */
.datas{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:11px}
.campo{display:flex;flex-direction:column;gap:3px}
.campo label{font-size:11.5px;color:var(--tinta-2)}
.campo input,.campo select,.campo textarea{padding:6px 9px;border:1px solid var(--linha);border-radius:var(--r);background:#fff;width:100%}
.campo input:focus,.campo select:focus,.campo textarea:focus{border-color:var(--azul);outline:none;box-shadow:0 0 0 3px rgba(26,110,232,.11)}
.grupo{margin-bottom:16px}
.grupo>h4{font-size:12.5px;color:var(--tinta-2);margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid var(--linha-2)}

/* Listas internas do cliente */
.item{border:1px solid var(--linha);border-radius:var(--r);padding:11px 13px;margin-bottom:8px;background:#fff}
.item.crit{border-left:3px solid var(--critico)}
.item.alta{border-left:3px solid var(--vermelho)}
.item.media{border-left:3px solid var(--ambar)}
.item.baixa{border-left:3px solid var(--linha)}
.item.feito{opacity:.62;border-left-color:var(--verde)}
.item h5{font-size:13px;margin:0 0 4px;font-weight:600}
.item .l{font-size:11.5px;color:var(--tinta-3);display:flex;flex-wrap:wrap;gap:10px;margin-top:5px}
.item .l b{color:var(--tinta-2);font-weight:600}
.hist{border-left:2px solid var(--linha);padding-left:14px;margin-left:5px}
.hist .h{position:relative;padding:0 0 15px}
.hist .h::before{content:"";position:absolute;left:-19px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--azul);border:2px solid #fff}
.hist .h .qd{font-size:11.5px;color:var(--tinta-3)}
.hist .h .tt{font-size:13px;font-weight:600}
.hist .h .ds{font-size:12.5px;color:var(--tinta-2);white-space:pre-wrap}

/* Modais utilitários */
.modal{position:fixed;inset:0;background:rgba(12,27,63,.45);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.modal.on{display:flex}
.modal__c{background:#fff;border-radius:9px;width:min(660px,100%);max-height:88vh;overflow-y:auto;box-shadow:0 20px 50px rgba(12,27,63,.3)}
.modal__h{padding:15px 20px;border-bottom:1px solid var(--linha);display:flex;align-items:center}
.modal__h h3{font-size:15px}
.modal__h button{margin-left:auto;background:none;border:0;font-size:19px;cursor:pointer;color:var(--tinta-3)}
.modal__b{padding:20px}
.modal__f{padding:13px 20px;border-top:1px solid var(--linha);display:flex;gap:8px;justify-content:flex-end;background:#FBFCFE}
.saida{width:100%;min-height:210px;padding:13px;border:1px solid var(--linha);border-radius:var(--r);font-family:inherit;font-size:13.5px;line-height:1.62;resize:vertical;background:#FCFDFF}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 20px;border-radius:var(--r);font-size:13px;z-index:300;box-shadow:0 8px 26px rgba(12,27,63,.3);opacity:0;pointer-events:none;transition:opacity .18s}
.toast.on{opacity:1}
.aviso{background:var(--ambar-bg);border:1px solid #F0DDB8;color:#7A5000;padding:9px 12px;border-radius:var(--r);font-size:12.5px;margin-bottom:12px}

/* Portao de login */
.login-gate{position:fixed;inset:0;background:var(--navy);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:var(--branco);border-radius:10px;box-shadow:var(--sombra);padding:30px 28px;width:100%;max-width:360px}
.login-card h2{font-size:16px;text-align:center;margin-bottom:4px;color:var(--tinta)}
.login-card p.sub{font-size:12px;color:var(--tinta-3);text-align:center;margin:0 0 20px}
.login-card label{display:block;font-size:12px;color:var(--tinta-2);margin:12px 0 4px}
.login-card input{width:100%;padding:9px 11px;border:1px solid var(--linha);border-radius:var(--r);font-size:13.5px;background:var(--papel)}
.login-card input:focus{border-color:var(--azul);outline:none;box-shadow:0 0 0 3px rgba(26,110,232,.12);background:#fff}
.login-card .erro{color:var(--vermelho);font-size:12px;margin-top:10px;min-height:14px}
.login-card .acoes{margin-top:18px;display:flex;flex-direction:column;gap:8px}
.login-card .acoes .btn{width:100%;text-align:center}
.login-card .troca{text-align:center;margin-top:16px;font-size:12.5px;color:var(--tinta-3)}
.login-card .troca button{background:none;border:0;color:var(--azul);cursor:pointer;font-size:12.5px;padding:0}
.login-card .esqueci{text-align:center;margin-top:10px}
.login-card .esqueci button{background:none;border:0;color:var(--tinta-3);cursor:pointer;font-size:11.5px;text-decoration:underline;padding:0}

/* Menu de usuario (rodape da barra lateral) */
.user-menu{position:relative}
.user-menu__btn{display:flex;align-items:center;gap:7px;width:100%;background:none;border:0;color:#B9C8E2;padding:6px 2px;cursor:pointer;font-size:11.5px;text-align:left}
.user-menu__btn:hover{color:#fff}
.user-menu__email{flex:1;word-break:break-all;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-menu__caret{font-size:9px;opacity:.7;flex:none}
.user-menu__pop{position:absolute;bottom:calc(100% + 6px);left:0;width:100%;min-width:196px;background:#fff;border-radius:var(--r);box-shadow:var(--sombra);border:1px solid var(--linha);padding:6px;display:none;z-index:60}
.user-menu__pop.on{display:block}
.user-menu__pop button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 9px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--tinta)}
.user-menu__pop button:hover{background:var(--papel)}
.user-menu__pop button.sair{color:var(--vermelho)}
.user-menu__pop hr{border:0;border-top:1px solid var(--linha-2);margin:5px 2px}
.nota{font-size:12px;color:var(--tinta-3);margin-top:8px}
.duas{display:grid;grid-template-columns:1.55fr 1fr;gap:16px;align-items:start}
.barra{height:6px;background:var(--linha-2);border-radius:4px;overflow:hidden;margin-top:5px}
.barra i{display:block;height:100%;background:var(--azul);border-radius:4px}
.ind{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:11px}
.ind .c{border:1px solid var(--linha);border-radius:var(--r);padding:12px 14px;background:#fff}
.ind .c small{font-size:11.5px;color:var(--tinta-3);display:block;line-height:1.35}
.ind .c b{font-size:21px;font-weight:660;letter-spacing:-.02em}
.ind .c b span{font-size:12px;font-weight:500;color:var(--tinta-3)}
.ind .c .sub{font-size:11px;color:var(--tinta-3);margin-top:2px}

@media (max-width:1080px){ .duas{grid-template-columns:1fr} }
@media (max-width:840px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:row;align-items:center;overflow-x:auto}
  .rail__logo{border-bottom:0;border-right:1px solid rgba(255,255,255,.09);padding:12px 14px;flex:0 0 auto}
  .rail__logo span{display:none}
  .rail nav{display:flex;gap:4px;padding:8px}
  .nav-b{white-space:nowrap}
  .nav-b.on::before{display:none}
  .rail__foot{display:none}
  .view{padding:16px 14px 50px}
  .top{padding:12px 14px;flex-wrap:wrap}
  .busca{width:100%;margin-left:0;order:3}
}
@media print{.rail,.top,.acoes,.filtros{display:none}}

/* ---------- Kanban: arraste, grupos de pausa ---------- */
.kcard{transition:box-shadow .12s,opacity .12s}
.kcard[draggable="true"]{cursor:grab}
.kcard.arrastando{opacity:.42;cursor:grabbing}
.col.alvo{background:#E3EDFC;box-shadow:inset 0 0 0 2px var(--azul)}
.col.alvo .col__h{color:var(--oceano)}
.gp{margin:2px 0 4px}
.gp__h{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--tinta-2);padding:5px 8px;
  background:#E5E9F0;border-radius:5px;margin-bottom:6px;border-left:3px solid var(--oceano)}
.gp__h b{margin-left:auto;color:var(--tinta-3)}
.gp__b{display:flex;flex-direction:column;gap:8px;padding-left:6px;border-left:1px dashed #CBD4E2;margin-left:3px}
.gp__solto{font-size:11px;color:var(--tinta-3);padding:5px 8px;margin:8px 0 6px;border-top:1px dashed #CBD4E2}

/* ---------- Barra fixa e edição rápida do cliente ---------- */
.dbar{position:sticky;top:0;z-index:6;background:var(--navy-2);color:#fff;padding:9px 24px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-top:1px solid rgba(255,255,255,.09);font-size:12.5px}
.dbar .nm{font-weight:640;font-size:13.5px}
.dbar .sep{color:#4E6491}
.dbar .ac{color:#CFDDF4;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dbar .dir{margin-left:auto;display:flex;gap:7px}
.dbar .btn{background:rgba(255,255,255,.13);border-color:transparent;color:#fff}
.dbar .btn:hover{background:rgba(255,255,255,.24)}
.rapida{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;background:#fff;border:1px solid var(--linha);
  border-radius:8px;padding:12px 14px;margin-bottom:16px;box-shadow:var(--sombra)}
.rapida .campo{min-width:140px;flex:1}
.rapida .campo label{font-weight:600;color:var(--tinta-3)}
.manualTag{font-size:10.5px;background:var(--ambar-bg);color:var(--ambar);padding:1px 6px;border-radius:4px}

/* ---------- Área de mensagem de cobrança ---------- */
.msgbox{display:grid;grid-template-columns:250px 1fr;gap:16px}
.msgbox .op{display:flex;flex-direction:column;gap:9px}
.msgbox .op label{font-size:11.5px;color:var(--tinta-2)}
.msgbox .op select,.msgbox .op input[type=text]{width:100%;padding:6px 9px;border:1px solid var(--linha);border-radius:var(--r)}
.msgbox .chk-l{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--tinta-2)}
.msgbox .chk-l input{width:auto}
.msgbox .prev{display:flex;flex-direction:column}
.msgbox .prev textarea{min-height:230px}
.msgbox .acoesmsg{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
@media (max-width:820px){.msgbox{grid-template-columns:1fr}}

/* ---------- Contatos ---------- */
.contato{display:flex;gap:12px;align-items:center;border:1px solid var(--linha);border-radius:var(--r);padding:9px 12px;margin-bottom:7px;background:#fff}
.contato .n{font-weight:600}
.contato .d{font-size:11.5px;color:var(--tinta-2)}
.contato .p{margin-left:auto;display:flex;gap:5px;flex-wrap:wrap}

/* ---------- Diversos ---------- */
.arquivado{opacity:.6}
.linha-acao{display:flex;gap:6px}
.btn--mini{padding:2px 7px;font-size:11.5px;border-radius:4px}
.mov{font-size:12px;color:var(--tinta-2);border-left:2px solid var(--linha);padding:2px 0 10px 12px;margin-left:4px;position:relative}
.mov::before{content:"";position:absolute;left:-5px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--oceano);border:2px solid #fff}
.mov b{color:var(--tinta)}
.excecao{color:var(--ambar);font-weight:600}

.lin-cli td{background:#F3F6FB;border-top:1px solid var(--linha)}
.lin-cli .cli-nome{display:inline}
.lin-cli .cli-sub{margin-left:8px}
.lin-ativo td:first-child{padding-left:26px;border-left:3px solid var(--linha-2)}
.abas{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.aba{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);color:#CFDDF4;
  border-radius:6px;padding:5px 11px;font-size:12px;cursor:pointer}
.aba:hover{background:rgba(255,255,255,.2);color:#fff}
.aba.on{background:#fff;color:var(--navy);border-color:#fff;font-weight:640}
</style>
</head>

<script>
/* Banco compartilhado (Supabase) — todo o time le/escreve o mesmo estado.
   A chave abaixo e publica por design (RLS controla o acesso real). */
const SUPA_URL = 'https://zardgoacexavxncrfxjy.supabase.co';
const SUPA_KEY = 'sb_publishable_C9vsiSyLbnu8NkWxmtN9WQ_Y8aHSMMu';
const supa = window.supabase.createClient(SUPA_URL, SUPA_KEY);
</script>
<script>
/* ============================================================
   AUTENTICAÇÃO (Supabase Auth) — acesso restrito ao time Trinus.
   ============================================================ */
let modoCadastroLogin = false;

function alternarModoLogin(){
  modoCadastroLogin = !modoCadastroLogin;
  document.getElementById('loginBtnEntrar').style.display = modoCadastroLogin ? 'none' : 'block';
  document.getElementById('loginBtnCriar').style.display = modoCadastroLogin ? 'block' : 'none';
  document.getElementById('loginTrocaTexto').textContent = modoCadastroLogin ? 'Já tem conta?' : 'Ainda não tem conta?';
  document.getElementById('loginTrocaBtn').textContent = modoCadastroLogin ? 'Entrar' : 'Criar conta';
  document.getElementById('loginErro').textContent = '';
}

function mostrarErroLogin(msg){ document.getElementById('loginErro').textContent = msg; }

function mostrarLoginGate(){
  document.getElementById('loginGate').style.display = 'flex';
}
function esconderLoginGate(){
  document.getElementById('loginGate').style.display = 'none';
}

async function fazerLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const senha = document.getElementById('loginSenha').value;
  if(!email || !senha){ mostrarErroLogin('Preencha e-mail e senha.'); return; }
  mostrarErroLogin('Entrando...');
  const { error } = await supa.auth.signInWithPassword({ email, password:senha });
  if(error){ mostrarErroLogin(error.message.includes('Invalid') ? 'E-mail ou senha incorretos.' : error.message); return; }
  mostrarErroLogin('');
}

async function fazerCadastro(){
  const email = document.getElementById('loginEmail').value.trim();
  const senha = document.getElementById('loginSenha').value;
  if(!email || !senha){ mostrarErroLogin('Preencha e-mail e senha.'); return; }
  if(!/@trinusco\.com\.br$/i.test(email)){ mostrarErroLogin('Cadastro restrito a e-mails @trinusco.com.br'); return; }
  if(senha.length<6){ mostrarErroLogin('A senha precisa ter pelo menos 6 caracteres.'); return; }
  mostrarErroLogin('Criando conta...');
  const { error } = await supa.auth.signUp({ email, password:senha });
  if(error){ mostrarErroLogin(error.message); return; }
  mostrarErroLogin('');
}

async function esqueciSenha(){
  const email = document.getElementById('loginEmail').value.trim();
  if(!email){ mostrarErroLogin('Digite seu e-mail acima e clique em "Esqueci minha senha" novamente.'); return; }
  const { error } = await supa.auth.resetPasswordForEmail(email);
  if(error){ mostrarErroLogin(error.message); return; }
  mostrarErroLogin('Link de redefinição enviado para ' + email + '.');
}

async function fazerLogout(){
  await supa.auth.signOut();
}

function atualizarRailInfo(email){
  const el = document.getElementById('railInfo');
  if(el) el.innerHTML = `
    <div class="user-menu" id="userMenu">
      <button class="user-menu__btn" onclick="toggleUserMenu()" title="${email}">
        <span class="user-menu__email">${email}</span>
        <span class="user-menu__caret">▾</span>
      </button>
      <div class="user-menu__pop" id="userMenuPop">
        <button onclick="fecharUserMenu();abrirEditarSenha()">Editar senha</button>
        <hr>
        <button class="sair" onclick="fecharUserMenu();fazerLogout()">Sair</button>
      </div>
    </div>`;
}

function toggleUserMenu(){ document.getElementById('userMenuPop').classList.toggle('on'); }
function fecharUserMenu(){ const p=document.getElementById('userMenuPop'); if(p) p.classList.remove('on'); }
document.addEventListener('click', e=>{
  const um = document.getElementById('userMenu');
  if(um && !um.contains(e.target)) fecharUserMenu();
});

function abrirEditarSenha(){
  abrirModal('Editar senha', `
    <div class="campo" style="margin-bottom:11px"><label>Senha atual</label><input type="password" id="senhaAtual" autocomplete="current-password"></div>
    <div class="campo" style="margin-bottom:11px"><label>Nova senha</label><input type="password" id="senhaNova" autocomplete="new-password"></div>

    <div id="senhaErro" style="color:var(--vermelho);font-size:12px;min-height:16px;margin-top:6px"></div>
  `, `<button class="btn" onclick="fecharModal()">Cancelar</button><button class="btn btn--p" onclick="salvarNovaSenha()">Salvar nova senha</button>`);
}

async function salvarNovaSenha(){
  const atual = document.getElementById('senhaAtual').value;
  const nova = document.getElementById('senhaNova').value;
  const nova2 = document.getElementById('senhaNova2').value;
  const erroEl = document.getElementById('senhaErro');
  erroEl.textContent = '';
  if(!atual || !nova || !nova2){ erroEl.textContent = 'Preencha todos os campos.'; return; }
  if(nova.length<6){ erroEl.textContent = 'A nova senha precisa ter pelo menos 6 caracteres.'; return; }
  if(nova !== nova2){ erroEl.textContent = 'As senhas não coincidem.'; return; }
  const { data:{ session } } = await supa.auth.getSession();
  if(!session){ erroEl.textContent = 'Sessão expirada. Feche este aviso, saia e entre novamente.'; return; }
  erroEl.textContent = 'Verificando senha atual...';
  const { error: erroLogin } = await supa.auth.signInWithPassword({ email: session.user.email, password: atual });
  if(erroLogin){ erroEl.textContent = 'Senha atual incorreta.'; return; }
  erroEl.textContent = 'Salvando...';
  const { error: erroUpdate } = await supa.auth.updateUser({ password: nova });
  if(erroUpdate){ erroEl.textContent = erroUpdate.message; return; }
  fecharModal();
  toast('Senha alterada com sucesso.');
}

supa.auth.onAuthStateChange((evento, sessao)=>{
  if(evento==='SIGNED_IN'){
    esconderLoginGate();
    bootRemoto().then(()=>atualizarRailInfo(sessao.user.email));
  }else if(evento==='SIGNED_OUT'){
    mostrarLoginGate();
  }
});

async function iniciarApp(){
  const { data:{ session } } = await supa.auth.getSession();
  if(!session){ mostrarLoginGate(); return; }
  esconderLoginGate();
  await bootRemoto();
  atualizarRailInfo(session.user.email);
}

<script>
/* Base: aba "Controle" da planilha de fechamento mensal.
   Nomes repetidos foram consolidados: 1 cliente, varios ativos.
   Camada imutavel - nunca sobrescrita pela operacao diaria.
   Carregada do Supabase (tabelas seed_clientes/seed_meta) em bootRemoto(). */
let SEED = {clientes:[], orfaosDatas:[]};
</script>
<script>
/* ============================================================
   1. ESTADO E PERSISTÊNCIA
   ------------------------------------------------------------
   SEED  = dados importados da planilha (imutáveis, nunca apagados)
   DB    = camada operacional criada nesta aplicação (localStorage)

const CHAVE = 'trinus.onboarding.v1';
let DB = { clientes:{}, info:{}, novos:[], ativosExtras:{}, criadoEm:null, feriados:[] };

function carregar(jaCarregadoDoRemoto){

    }

  baseAtivos().forEach(a=>{ DB.clientes[a.id] = Object.assign(novoRegistro(), DB.clientes[a.id]||{}); });
  baseClientes().forEach(c=>infoCliente(c.id));

}
function novoRegistro(){
  return { datas:{}, pausa:{}, agendas:[], pendencias:[], historico:[], atualizacoes:[], cobrancas:[],
           statusManual:'', dados:{}, aplicabilidades:{}, contatos:[], movimentacoes:[], manual:{},
           arquivado:false, excluido:false };
}

function salvar(){

let _salvarRemotoTimer = null;
function salvarRemoto(){

    }

}
async function bootRemoto(){
  try{
    const { data: clientesRemotos, error: e1 } = await supa.from('seed_clientes').select('*').order('cliente');
    if(e1) throw e1;
    SEED.clientes = (clientesRemotos||[]).map(c=>({
      id:c.id, cliente:c.cliente, razaoSocial:c.razao_social||'', cnpj:c.cnpj||'', elite:c.elite||'',
      ativosSugeridos:c.ativos_sugeridos||[], ativos:c.ativos||[]
    }));
    const { data: meta, error: e2 } = await supa.from('seed_meta').select('orfaos_datas').eq('id',1).maybeSingle();
    if(e2) throw e2;
    SEED.orfaosDatas = (meta && meta.orfaos_datas) || [];

    const { data: estado, error: e3 } = await supa.from('estado_operacional').select('dados').eq('id',1).maybeSingle();
    if(e3) throw e3;
    if(estado && estado.dados) DB = Object.assign({clientes:{},info:{},novos:[],ativosExtras:{},criadoEm:null,feriados:[]}, estado.dados);
  }catch(err){
    console.error('Falha ao carregar do banco compartilhado', err);
    toast('Não foi possível conectar ao banco compartilhado. Verifique sua conexão e recarregue a página.');
  }

}
function reg(id){ if(!DB.clientes[id]) DB.clientes[id]=novoRegistro(); return DB.clientes[id]; }

/* ============================================================
   2. MOTOR DE DIAS ÚTEIS
   Função centralizada. Feriados nacionais/corporativos podem ser
   cadastrados em DB.feriados como 'AAAA-MM-DD' sem tocar no resto.
   ============================================================ */
function hojeISO(){ const d=new Date(); return iso(d); }
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dt(s){ if(!s) return null; const p=String(s).slice(0,10).split('-'); if(p.length!==3) return null;
  const d=new Date(+p[0],+p[1]-1,+p[2]); return isNaN(d)?null:d; }
function ehData(s){ return /^\d{4}-\d{2}-\d{2}/.test(String(s||'').trim()); }
function eUtil(d){ const w=d.getDay(); return w!==0 && w!==6 && DB.feriados.indexOf(iso(d))<0; }

/** Dias úteis decorridos de A até B (positivo se B > A, negativo se B < A). */
function diasUteis(a,b){
  const x=dt(a), y=dt(b); if(!x||!y) return null;
  const sinal = y<x ? -1 : 1;
  let ini = sinal>0 ? new Date(x) : new Date(y);
  const fim = sinal>0 ? y : x;
  let n=0;
  while(ini < fim){ ini.setDate(ini.getDate()+1); if(eUtil(ini)) n++; }
  return n*sinal;
}
/** Soma N dias úteis a uma data. */
function somaUteis(a,n){
  const d=dt(a); if(!d) return null;
  let i=0; while(i<n){ d.setDate(d.getDate()+1); if(eUtil(d)) i++; }
  return iso(d);
}
/** Primeiro dia útil em ou após a data. */
function proximoUtil(a){ const d=dt(a); if(!d) return null; while(!eUtil(d)) d.setDate(d.getDate()+1); return iso(d); }
function somaCorridos(a,n){ const d=dt(a); if(!d) return null; d.setDate(d.getDate()+n); return iso(d); }

const MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function br(s){ const d=dt(s); return d? String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0') : '—'; }
function brLongo(s){ const d=dt(s); return d? String(d.getDate()).padStart(2,'0')+'/'+MES[d.getMonth()]+'/'+d.getFullYear() : '—'; }
function du(n){ if(n===null||n===undefined) return '—'; return n+' '+(Math.abs(n)===1?'dia útil':'dias úteis'); }

/* ============================================================
   3. NORMALIZAÇÃO INTELIGENTE DOS VALORES DA PLANILHA
   Nunca converte texto livre em erro. O valor original é sempre
   preservado e exibido junto do estado interpretado.
   ============================================================ */
const ESTADOS = ['Concluído','Em andamento','Parcial','Pendente','A verificar','Não aplicável','Não informado'];
function normalizar(bruto){
  const raw = String(bruto==null?'':bruto).trim();
  const t = raw.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim();
  if(!t) return {estado:'Não informado', raw:''};
  if(ehData(raw)) return {estado:'Concluído', raw};
  if(/^(n\/a|na|nao se aplica|nao aplica|-|--)$/.test(t)) return {estado:'Não aplicável', raw};
  if(/^\d?q\//.test(t) || /^(sim|ok|realizado|realizada|enviado|enviada|concluido|concluida|feito|liberado|recorrente)\b/.test(t)) return {estado:'Concluído', raw};
  if(/^(parcial)/.test(t)) return {estado:'Parcial', raw};
  if(/^(nao|não|n)\b/.test(t)) return {estado:'Pendente', raw};
  if(/^pendente|falta|aguardando/.test(t)) return {estado:'Pendente', raw};
  if(/em andamento|em elabora|solicitad|agendad|agendar|a ser agendad|a serem agendad|coleta|em teste|previs|semana |setembro|outubro|out\.|em vias/.test(t)) return {estado:'Em andamento', raw};
  if(/verificar|remarcar|pausado|viabilidade|a definir/.test(t)) return {estado:'A verificar', raw};
  return {estado:'A verificar', raw};   // texto livre — preservado, nunca descartado
}
const CAMPOS_LABEL = {
  envioEmailPosKickoff:'E-mail pós-kickoff', checklist:'Check-list', retorno:'Retorno',
  csatEnvio:'Pesquisa CSAT', csatColeta:'Coleta CSAT', jornadaSucesso:'Jornada de sucesso',
  apresentacaoPlataforma:'Apresentação da plataforma', acessoPlataforma:'Acesso à plataforma',
  credenciaisApi:'Credenciais API enviadas', ticketApi:'Ticket credenciais API', apiConectada:'API conectada',
  agendasEspecialistas:'Agendas com especialistas', relatoriosQuinzenais:'Relatórios quinzenais',
  acessoContaBancaria:'Acesso conta bancária', acessoFiscais:'Acesso fiscais',
  passagemContabilidade:'Passagem contabilidade', marcosSucesso:'Marcos de sucesso'
};

/* ============================================================
   4. TAXONOMIAS OFICIAIS
   ============================================================ */
const STATUS = ['01 - Aguardando handoff','02 - Aguardando kickoff','03 - Setup/Coleta de documentação',
 '04 - Pausado','05 - Migração/Implantação','06 - Em elaboração','07 - Op. Assistida',
 '08 - Op. Ativa c/ pendência','09 - Op. Ativa','10 - Entregue','11 - Distrato em negociação'];
const RESPONSAVEIS = ['Cliente','Onboarding','KA','Comercial','Sistemas','Financeiro','Backoffice','Jurídico',
 'Conciliação','Contabilidade','Gerente de Incorporação','Obras','Outra área'];
const IMPACTOS = {'baixo':1,'médio':2,'alto':3,'bloqueador':5};
const ETAPAS = ['Handoff','Kickoff','Setup','Documentação','Implantação','Capacitação','Op. Assistida','Op. Ativa'];
const SEM_STATUS = 'Sem status definido';
const ETAPA_POR_STATUS = {
 '':-1,
 '01 - Aguardando handoff':0,'02 - Aguardando kickoff':1,'03 - Setup/Coleta de documentação':2,
 '04 - Pausado':-1,'05 - Migração/Implantação':4,'06 - Em elaboração':4,'07 - Op. Assistida':6,
 '08 - Op. Ativa c/ pendência':7,'09 - Op. Ativa':7,'10 - Entregue':7,'11 - Distrato em negociação':-1
};
const APLIC = [['api','API / integração'],['plataforma','Plataforma'],['agendas','Agendas com especialistas'],
  ['bancario','Acesso bancário'],['fiscal','Acessos fiscais'],['contabil','Passagem contábil']];
const APLIC_PADRAO = {api:'sim',plataforma:'sim',agendas:'sim',bancario:'sim',fiscal:'sim',contabil:'sim'};
const MEIOS = ['WhatsApp','E-mail','Reunião','Telefone','Outro'];
const PAPEIS = [['principal','Contato principal'],['financeiro','Contato financeiro'],['tecnico','Contato técnico'],['decisao','Contato de decisão']];
const SLA_DOC = 5;        // dias úteis para o cliente devolver a documentação
const CADENCIA_COBRANCA = 3; // dias corridos entre cobranças, sempre caindo em dia útil

/* ============================================================
   5. MODELO: CLIENTE → ATIVOS
   Nomes repetidos na aba Controle são o MESMO cliente com mais
   de um ativo. A unidade operacional é o ATIVO: status, farol,
   SLA, pendências e agendas pertencem a ele. Contatos e dados
   cadastrais pertencem ao cliente.
   ============================================================ */
function infoCliente(cid){ if(!DB.info[cid]) DB.info[cid]={contatos:[],dados:{},arquivado:false}; 
  const i=DB.info[cid]; i.contatos=i.contatos||[]; i.dados=i.dados||{}; return i; }

function baseClientes(){
  return SEED.clientes.concat(DB.novos||[]).map(c=>{
    const extras=(DB.ativosExtras||{})[c.id]||[];
    const i=DB.info[c.id]||{};
    return Object.assign({}, c, i.dados||{}, {ativos:c.ativos.concat(extras), arquivadoCliente:!!(i.arquivado)});
  });
}
/** Lista plana de ativos, cada um já carregando os dados do cliente. */
function baseAtivos(){
  const out=[];
  baseClientes().forEach(c=>c.ativos.forEach((a,i)=>out.push(Object.assign({}, a, {
    clienteId:c.id, cliente:c.cliente, razaoSocial:c.razaoSocial, cnpj:c.cnpj, elite:c.elite,
    ativoNome:a.nome, indiceAtivo:i, totalAtivos:c.ativos.length, clienteArquivado:c.arquivadoCliente,
    ativosSugeridos:c.ativosSugeridos||[]
  }))));
  return out;
}
function seedAtivo(id){ return baseAtivos().find(a=>a.id===id)||null; }
function ativosDoCliente(cid){ return baseAtivos().filter(a=>a.clienteId===cid); }

function proximoIdCliente(nome){
  const b=String(nome||'cliente').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'cliente';
  let id=b,i=1; while(baseClientes().some(c=>c.id===id)){ i++; id=b+'-'+i; }
  return id;
}
function proximoIdAtivo(cid){
  let i=ativosDoCliente(cid).length+1, id=cid+'::a'+i;
  while(baseAtivos().some(a=>a.id===id)){ i++; id=cid+'::a'+i; }
  return id;
}

/** Ativo operacional = base da planilha + camada registrada na aplicação. */
function cliente(id){
  const s = seedAtivo(id); if(!s) return null;
  const r = reg(id);
  const datas = Object.assign({}, s.datas, r.datas);
  return Object.assign({}, s, r.dados||{}, {
    datas, pausa:r.pausa||{}, agendas:r.agendas||[], pendencias:r.pendencias||[],
    historico:r.historico||[], atualizacoes:r.atualizacoes||[], cobrancas:r.cobrancas||[],
    aplicabilidades:Object.assign({}, APLIC_PADRAO, r.aplicabilidades||{}),
    contatos:(DB.info[s.clienteId]&&DB.info[s.clienteId].contatos)||[],
    movimentacoes:r.movimentacoes||[], manual:r.manual||{},
    arquivado:!!r.arquivado || !!s.clienteArquivado, excluido:!!r.excluido, novo:!!s.novo,
    ativoNome:(r.dados&&r.dados.nome)||s.nome,
    status: (r.dados&&r.dados.status)!==undefined ? r.dados.status : s.status
  });
}
function todos(incluirArquivados){
  return baseAtivos().map(a=>cliente(a.id))
    .filter(c=>c && !c.excluido && (incluirArquivados || !c.arquivado))
    .map(analisar);
}
/** Rótulo de exibição: o nome do ativo só aparece quando o cliente tem mais de um. */
function rotulo(c){ return c.totalAtivos>1 ? c.cliente+' · '+c.ativoNome : c.cliente; }
function aplicavel(c,k){ return (c.aplicabilidades||{})[k] !== 'não'; }
function kaLabel(k){ const t=(k||'').trim(); if(!t) return 'Sem KA';
  const m={'jéssica':'Jessica','jessica':'Jessica','éster':'Ester','ester':'Ester'};
  return m[t.toLowerCase()] || t; }

/* ============================================================
   6. MOTOR DE ANÁLISE — SLA, pendências, farol, score, próxima ação
   Regra de ouro do projeto: nenhum cliente pode ficar vermelho
   sem uma próxima ação definida e um responsável.
   ============================================================ */
function slaDocumentacao(c){
  const H = hojeISO();
  const solicitada = c.datas.docSolicitada || c.datas.solicitacaoInicial;
  const completa   = c.datas.docCompleta;
  const out = {tem:false, solicitada, completa, venc:null, prazo:SLA_DOC, decorridos:null, saldo:null,
               atraso:0, ultimaCobranca:null, proximaCobranca:null, qtdCobrancas:(c.cobrancas||[]).length};
  if(!solicitada) return out;
  out.tem = true;
  out.venc = somaUteis(solicitada, SLA_DOC);
  out.decorridos = diasUteis(solicitada, completa || H);
  out.saldo = SLA_DOC - out.decorridos;
  const cobs = (c.cobrancas||[]).slice().sort();
  out.ultimaCobranca = cobs.length ? cobs[cobs.length-1] : (c.datas.ultimaCobranca||null);
  if(completa){ out.concluida = true; out.atraso = Math.max(0, diasUteis(out.venc, completa)); return out; }
  if(pausado(c)) return out;                       // relógio suspenso
  if(H > out.venc){
    out.atraso = diasUteis(out.venc, H);
    out.proximaCobranca = c.datas.proximaCobranca ||
      (out.ultimaCobranca ? proximoUtil(somaCorridos(out.ultimaCobranca, CADENCIA_COBRANCA)) : proximoUtil(out.venc));
  }
  return out;
}
function pausado(c){ return c.status.indexOf('04 -')===0; }
function pausaVencida(c){
  const r = c.pausa && c.pausa.retomada;
  return !!(pausado(c) && r && r < hojeISO());
}
function ultimoRegistro(c){
  const ds = [].concat((c.historico||[]).map(h=>h.data), (c.atualizacoes||[]).map(a=>a.data)).filter(Boolean).sort();
  return ds.length ? ds[ds.length-1] : (DB.criadoEm || null);
}

/** Pendências derivadas automaticamente do estado da planilha.
    São somadas às pendências registradas manualmente. */
function pendenciasDerivadas(c){
  const P=[], H=hojeISO(), n=k=>normalizar(c.campos[k]).estado, idx=ETAPA_POR_STATUS[c.status];
  const add=(o)=>P.push(Object.assign({auto:true, status:'aberta', abertura:null, prazo:null, cobrancas:0,
    podeComunicar:false, bloqueia:false, evidencia:'', obs:''}, o));
  const sla = slaDocumentacao(c);

  if(!c.status)
    add({id:'auto-sem-status', descricao:'Ativo sem status oficial definido', categoria:'Cadastro', responsavel:'Onboarding',
         origem:'Lacuna da planilha', impacto:'médio', bloqueia:true,
         proximaAcao:'Definir o status oficial deste ativo'});
  if(c.status.indexOf('01 -')===0)
    add({id:'auto-handoff', descricao:'Handoff ainda não recebido', categoria:'Entrada', responsavel:'Comercial',
         origem:'Status oficial', impacto:'alto', bloqueia:true, proximaAcao:'Solicitar handoff ao Comercial'});
  if(c.status.indexOf('02 -')===0)
    add({id:'auto-kickoff', descricao:'Kickoff ainda não realizado', categoria:'Kickoff', responsavel:'Onboarding',
         origem:'Status oficial', impacto:'alto', bloqueia:true, proximaAcao:'Agendar kickoff com o cliente'});
  if(c.datas.kickoffPrevisto && !c.datas.kickoffRealizado && c.datas.kickoffPrevisto < H && !pausado(c))
    add({id:'auto-kickoff-atraso', descricao:'Kickoff previsto para '+br(c.datas.kickoffPrevisto)+' não registrado como realizado',
         categoria:'Kickoff', responsavel:'Onboarding', origem:'Data prevista vencida', impacto:'alto',
         prazo:c.datas.kickoffPrevisto, bloqueia:true, proximaAcao:'Confirmar agenda e registrar o kickoff'});
  if(sla.tem && sla.atraso>0)
    add({id:'auto-doc', descricao:'Documentação incompleta após o prazo de '+SLA_DOC+' dias úteis',
         categoria:'Documentação', responsavel:'Cliente', origem:'Régua de SLA', impacto:'alto',
         prazo:sla.venc, bloqueia:true, podeComunicar:true, cobrancas:sla.qtdCobrancas,
         textoCliente:'Conclusão do envio da documentação solicitada',
         proximaAcao:'Cobrar a documentação pendente'});
  if(!sla.tem && idx>=2 && idx<=4 && !pausado(c) && ['Pendente','Parcial','Em andamento','A verificar'].indexOf(n('checklist'))>=0)
    add({id:'auto-doc-sem-data', descricao:'Coleta de documentação em aberto sem data de solicitação registrada',
         categoria:'Documentação', responsavel:'Onboarding', origem:'Lacuna de cadastro', impacto:'médio',
         proximaAcao:'Registrar a data da solicitação da documentação para iniciar o SLA'});
  if(idx>=2 && n('checklist')==='Parcial')
    add({id:'auto-checklist', descricao:'Check-list de documentação parcial', categoria:'Documentação',
         responsavel:'Cliente', impacto:'médio', origem:'Planilha', podeComunicar:true,
         textoCliente:'Itens restantes do check-list de documentação',
         proximaAcao:'Cobrar os itens restantes do check-list'});
  if(aplicavel(c,'api') && n('credenciaisApi')==='Concluído' && ['Pendente','Em andamento','A verificar'].indexOf(n('apiConectada'))>=0)
    add({id:'auto-api', descricao:'API ainda não conectada com as credenciais já enviadas', categoria:'Integração',
         responsavel:'Sistemas', origem:'Planilha', impacto:'alto', bloqueia:true,
         proximaAcao:'Acionar Sistemas sobre a conexão da API'});
  if(aplicavel(c,'plataforma') && idx>=4 && n('acessoPlataforma')==='Pendente')
    add({id:'auto-acesso', descricao:'Cliente sem acesso liberado à plataforma', categoria:'Plataforma',
         responsavel:'Onboarding', origem:'Planilha', impacto:'médio',
         proximaAcao:'Liberar o acesso e registrar a data'});
  if(idx>=2 && ['Pendente','A verificar'].indexOf(n('jornadaSucesso'))>=0 && !pausado(c))
    add({id:'auto-jornada', descricao:'Jornada de sucesso ainda não realizada', categoria:'Jornada',
         responsavel:'KA', origem:'Planilha', impacto:'médio', proximaAcao:'Agendar a Jornada de Sucesso'});
  if(idx>=6 && n('csatEnvio')==='Pendente')
    add({id:'auto-csat', descricao:'Pesquisa CSAT não enviada', categoria:'CSAT', responsavel:'KA',
         origem:'Planilha', impacto:'baixo', proximaAcao:'Enviar a pesquisa CSAT'});
  if(c.status.indexOf('08 -')===0){
    const manuais=(c.pendencias||[]).filter(p=>p.status!=='concluída');
    if(!manuais.length)
      add({id:'auto-op8', descricao:'Operação ativa com pendência sem detalhamento registrado', categoria:'Encerramento',
           responsavel:'Onboarding', origem:'Status oficial', impacto:'alto',
           proximaAcao:'Detalhar qual pendência impede o encerramento'});
  }
  if(pausaVencida(c))
    add({id:'auto-pausa', descricao:'Retomada prevista para '+br(c.pausa.retomada)+' está vencida', categoria:'Pausa',
         responsavel:c.pausa.responsabilidade||'Onboarding', origem:'Data de retomada vencida', impacto:'alto',
         prazo:c.pausa.retomada, proximaAcao:c.pausa.proximaAcao||'Retomar o cliente ou repactuar a data'});
  return P;
}

function scorePendencia(p){
  const H=hojeISO();
  let atraso = 0;
  if(p.prazo && p.status!=='concluída' && p.prazo < H) atraso = diasUteis(p.prazo, H);
  let s = atraso===0?0 : atraso<=2?1 : atraso<=5?2 : atraso<=10?3 : 5;
  s += IMPACTOS[p.impacto] || 1;
  if(p.bloqueia) s += 3;
  if((p.cobrancas||0) >= 3) s += 2;
  return {score:s, atraso};
}

function analisar(c){
  const H = hojeISO();
  const sla = slaDocumentacao(c);
  const manuais = (c.pendencias||[]).map(p=>Object.assign({},p));
  const abertas = manuais.filter(p=>p.status!=='concluída').concat(pendenciasDerivadas(c));
  abertas.forEach(p=>{ const r=scorePendencia(p); p._score=r.score; p._atraso=r.atraso; });
  abertas.sort((a,b)=> b._score-a._score || b._atraso-a._atraso);

  // agendas de especialistas
  const agendas = (c.agendas||[]).map(a=>{
    let sit='futura';
    if(a.realizada) sit='concluída';
    else if(a.prevista && a.prevista < H) sit='vencida';
    else if(a.prevista === H) sit='hoje';
    else if(!a.prevista) sit='sem data';
    return Object.assign({}, a, {_sit:sit});
  });

  // atividades vencidas e próximas
  const vencidos=[], avisos=[];
  abertas.forEach(p=>{ if(p._atraso>0) vencidos.push({o:'pendência', txt:p.descricao, dias:p._atraso});
    else if(p.prazo && diasUteis(H,p.prazo)<=2 && p.prazo>=H) avisos.push({o:'pendência', txt:p.descricao}); });
  agendas.forEach(a=>{ if(a._sit==='vencida') vencidos.push({o:'agenda', txt:'Agenda '+(a.area||'')+' — '+(a.tema||''), dias:diasUteis(a.prevista,H)});
    else if(a._sit==='hoje') avisos.push({o:'agenda', txt:'Agenda hoje com '+(a.area||'especialista')}); });
  if(sla.tem && !sla.concluida && !pausado(c) && sla.atraso===0 && sla.saldo!==null && sla.saldo<=2)
    avisos.push({o:'sla', txt:'Prazo da documentação vence em '+du(sla.saldo)});

  const semAtualizacao = diasUteis(ultimoRegistro(c), H);
  const cobrancaHoje = !!(sla.proximaCobranca && sla.proximaCobranca <= H);

  // score do cliente
  let score = abertas.length ? abertas[0]._score : 0;
  if(abertas.length>1) score += Math.min(3, abertas.length-1);

  // farol
  let farol='verde';
  if(pausado(c) && !pausaVencida(c)) farol='pausado';
  else if(vencidos.length) farol='vermelho';
  else if(avisos.length || c.status.indexOf('08 -')===0 || (semAtualizacao!==null && semAtualizacao>5) ||
          abertas.some(p=>p.impacto==='bloqueador'||p.bloqueia)) farol='ambar';
  if(farol==='vermelho' || farol==='ambar'){
    const maiorAtraso = vencidos.reduce((m,v)=>Math.max(m,v.dias||0),0);
    const crit = score>=10 || maiorAtraso>10 || vencidos.length>=3 ||
                 abertas.some(p=>p.impacto==='bloqueador') ||
                 (semAtualizacao!==null && semAtualizacao>10 && !pausado(c)) ||
                 (c.status.indexOf('08 -')===0 && vencidos.length>0);
    if(crit && vencidos.length) farol='critico';
  }
  if(farol!=='pausado' && pausado(c) && !pausaVencida(c)) farol='pausado';

  // próxima melhor ação — nunca vazia. O analista pode sobrepor a sugestão do sistema.
  const pa = proximaAcao(c, sla, abertas, agendas);
  const mn = c.manual||{};
  const manualAcao = !!(mn.acao||mn.responsavel||mn.prazoAcao);
  if(mn.acao) pa.acao = mn.acao;
  if(mn.responsavel) pa.resp = mn.responsavel;
  if(mn.acao||mn.responsavel) pa.motivo = 'Definido manualmente pelo analista';
  if(mn.farol) farol = mn.farol;

  const inicio = c.datas.handoff || c.datas.handoffRecebido || c.datas.kickoffRealizado || null;
  return Object.assign({}, c, {
    _sla:sla, _pend:abertas, _pendManuais:manuais, _agendas:agendas, _vencidos:vencidos, _avisos:avisos,
    _farol:farol, _score:score, _semAtualizacao:semAtualizacao, _cobrancaHoje:cobrancaHoje,
    _acao:pa.acao, _acaoResp:pa.resp, _acaoPor:pa.motivo, _acaoManual:manualAcao,
    _farolManual:!!(c.manual&&c.manual.farol), _prazoAcao:(c.manual&&c.manual.prazoAcao)||null,
    _diasOnboarding: inicio ? diasUteis(inicio, H) : null,
    _diasNaEtapa: diasNaEtapa(c),
    _principal: abertas.length ? abertas[0] : null,
    _aguardandoCliente: abertas.some(p=>p.responsavel==='Cliente'),
    _aguardandoTrinus: abertas.some(p=>p.responsavel && p.responsavel!=='Cliente'),
    _ka: kaLabel(c.ka), _etapa: etapaAtual(c)
  });
}

function diasNaEtapa(c){
  const H=hojeISO(), d=c.datas;
  const mv=(c.movimentacoes||[]).filter(m=>m.para===c.status);
  if(mv.length) return diasUteis(mv[mv.length-1].em.slice(0,10), H);
  const marco = {0:d.handoff, 1:d.handoffRecebido||d.handoff, 2:d.kickoffRealizado, 3:d.kickoffRealizado,
                 4:d.docCompleta||d.kickoffRealizado, 6:d.assistidaInicio, 7:d.opAtivaEntrada}[ETAPA_POR_STATUS[c.status]];
  if(pausado(c)) return c.pausa && c.pausa.data ? diasUteis(c.pausa.data,H) : null;
  return marco ? diasUteis(marco,H) : null;
}
function etapaAtual(c){
  const i = ETAPA_POR_STATUS[c.status];
  if(i>=0) return ETAPAS[i];
  if(pausado(c)) return 'Pausado';
  if(!c.status) return SEM_STATUS;
  return '—';
}

function proximaAcao(c, sla, abertas, agendas){
  const H=hojeISO();
  if(!c.status) return {acao:'Definir o status oficial deste ativo', resp:'Onboarding', motivo:'Ativo sem status na planilha'};
  if(pausado(c)){
    if(pausaVencida(c)) return {acao:(c.pausa.proximaAcao||'Retomar o cliente ou repactuar a data de retomada'),
      resp:c.pausa.responsabilidade||'Onboarding', motivo:'Retomada vencida em '+br(c.pausa.retomada)};
    if(!c.pausa.retomada) return {acao:'Registrar motivo e data prevista de retomada', resp:'Onboarding', motivo:'Pausa sem data de retomada'};
    return {acao:'Aguardar retomada prevista para '+br(c.pausa.retomada), resp:c.pausa.responsabilidade||'Cliente', motivo:'Cliente pausado — SLA suspenso'};
  }
  const ag = agendas.find(a=>a._sit==='vencida') || agendas.find(a=>a._sit==='hoje');
  if(ag && (!abertas.length || abertas[0]._score<6))
    return {acao:(ag._sit==='hoje'?'Conduzir e registrar a agenda com ':'Reagendar e registrar a agenda com ')+(ag.area||'especialista'),
            resp:ag.area||'Onboarding', motivo:'Agenda '+ag._sit};
  if(sla.tem && sla.atraso>0 && sla.proximaCobranca && sla.proximaCobranca<=H)
    return {acao: sla.proximaCobranca<H ? 'Cobrar a documentação — cobrança prevista para '+br(sla.proximaCobranca)+' e ainda não registrada'
                                        : 'Cobrar a documentação — cobrança prevista para hoje', resp:'Cliente', motivo:'Régua de cobrança'};
  if(abertas.length) return {acao:abertas[0].proximaAcao || 'Tratar: '+abertas[0].descricao,
                             resp:abertas[0].responsavel||'Onboarding', motivo:abertas[0].descricao};
  if(sla.tem && !sla.concluida) return {acao:'Aguardar retorno do cliente — prazo até '+br(sla.venc), resp:'Cliente', motivo:'Documentação dentro do prazo'};
  if(sla.concluida && !c.datas.checklistConcluido) return {acao:'Validar a documentação recebida', resp:'Onboarding', motivo:'Documentação entregue'};
  const i = ETAPA_POR_STATUS[c.status];
  if(i===4) return {acao:'Acompanhar a implantação e confirmar o próximo marco', resp:'Onboarding', motivo:'Status '+c.status};
  if(i===6) return {acao: c.datas.assistidaPrevisto ? 'Concluir a operação assistida até '+br(c.datas.assistidaPrevisto)
                     : 'Definir a data de término da operação assistida', resp:'Onboarding', motivo:'Operação assistida'};
  if(c.status.indexOf('09 -')===0) return {acao: normalizar(c.campos.csatEnvio).estado==='Pendente' ?
      'Enviar a pesquisa CSAT' : 'Encerrar o onboarding e formalizar a passagem para o KA', resp:'KA', motivo:'Operação ativa'};
  if(c.status.indexOf('10 -')===0) return {acao:'Nenhuma ação pendente — onboarding entregue', resp:'—', motivo:'Entregue'};
  return {acao:'Registrar a próxima ação deste cliente', resp:'Onboarding', motivo:'Sem pendência mapeada'};
}

/* ============================================================
   6b. MOVIMENTAÇÃO DE ETAPA E CONSISTÊNCIA DA JORNADA
   O sistema avisa, mas nunca bloqueia: exceções reais existem
   na operação. Toda exceção fica registrada.
   ============================================================ */
function agoraISO(){
  const d=new Date();
  return iso(d)+'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function brHora(s){ if(!s) return '—'; const p=String(s).split('T'); return brLongo(p[0])+(p[1]?' às '+p[1]:''); }
const ORDEM_STATUS = STATUS.reduce((a,s,i)=>(a[s]=i,a),{'':-1});

/** Retorna a lista de incoerências ao mover um cliente para um novo status. */
function checarCoerencia(c, novo){
  const av=[], n=k=>normalizar(c.campos[k]).estado, o=ORDEM_STATUS[novo], atual=ORDEM_STATUS[c.status];
  if(o===undefined) return av;
  const avancando = o>atual && novo.indexOf('04 -')!==0;
  if(!avancando) return av;
  if(o>=1 && !c.datas.handoff && !c.datas.handoffRecebido) av.push('Não há data de handoff registrada.');
  if(o>=2 && !c.datas.kickoffRealizado && novo.indexOf('02 -')!==0) av.push('O kickoff ainda não está registrado como realizado.');
  if(o>=4 && !c.datas.docCompleta && ['Pendente','Parcial','Em andamento'].indexOf(n('checklist'))>=0)
    av.push('A coleta de documentação ainda não está concluída.');
  if(o>=4 && aplicavel(c,'api') && n('apiConectada')!=='Concluído' && n('credenciaisApi')==='Concluído')
    av.push('A API ainda não está conectada.');
  if(novo.indexOf('09 -')===0){
    const bloq=(c.pendencias||[]).filter(p=>p.status!=='concluída' && (p.bloqueia||p.impacto==='bloqueador'));
    if(bloq.length) av.push(bloq.length+' pendência(s) bloqueadora(s) continuam abertas.');
  }
  if(novo.indexOf('10 -')===0){
    const ab=(c.pendencias||[]).filter(p=>p.status!=='concluída');
    if(ab.length) av.push(ab.length+' pendência(s) seguem abertas.');
  }
  return av;
}

/** Executa a movimentação, guardando origem, destino, horário e tempo na etapa anterior. */
function moverEtapa(id, novo, obs, excecao){
  const c=cliente(id), r=reg(id), antes=c.status;
  if(antes===novo) return;
  const mvAnt=(r.movimentacoes||[]).filter(m=>m.para===antes);
  const desde = mvAnt.length ? mvAnt[mvAnt.length-1].em.slice(0,10) : null;
  const permanencia = desde ? diasUteis(desde, hojeISO()) : null;
  r.dados = r.dados||{}; r.dados.status = novo; r.statusManual='';
  r.movimentacoes.push({de:antes, para:novo, em:agoraISO(), obs:obs||'', excecao:!!excecao, permanencia});
  if(novo.indexOf('04 -')===0 && !r.pausa.data) r.pausa.data=hojeISO();
  if(novo.indexOf('07 -')===0 && !r.datas.assistidaInicio) r.datas.assistidaInicio=hojeISO();
  if(novo.indexOf('09 -')===0 && !r.datas.opAtivaEntrada) r.datas.opAtivaEntrada=hojeISO();
  if(novo.indexOf('10 -')===0 && !r.datas.onboardingEncerrado) r.datas.onboardingEncerrado=hojeISO();
  r.historico.push({data:hojeISO(), tipo:'Etapa alterada', texto:antes+' → '+novo+
    (permanencia!==null?' · permaneceu '+du(permanencia)+' na etapa anterior':'')+
    (excecao?' · movido com exceção registrada':'')+(obs?' · '+obs:'')});
  salvar();
}

/* Motivos de pausa: palavra livre digitada pelo analista, usada para agrupar. */
const SEM_MOTIVO='Sem motivo informado';
function motivoPausa(c){
  const m=(c.pausa&&c.pausa.motivoCurto||'').trim();
  return m || SEM_MOTIVO;
}
function chaveMotivo(m){ return String(m||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function motivosCadastrados(){
  const set={};
  baseAtivos().forEach(a=>{ const r=DB.clientes[a.id]; const m=r&&r.pausa&&r.pausa.motivoCurto;
    if(m&&m.trim()) set[chaveMotivo(m)]=m.trim(); });
  return Object.values(set).sort((a,b)=>a.localeCompare(b));
}
/** Agrupa os pausados por motivo. Motivos com um único cliente ficam fora dos grupos. */
function gruposDePausa(lista){
  const g={};
  lista.forEach(c=>{ const k=chaveMotivo(motivoPausa(c));
    (g[k]=g[k]||{rotulo:motivoPausa(c), clientes:[]}).clientes.push(c); });
  const grupos=Object.values(g).filter(x=>x.clientes.length>1 && chaveMotivo(x.rotulo)!==chaveMotivo(SEM_MOTIVO))
    .sort((a,b)=>b.clientes.length-a.clientes.length);
  const chavesAgrupadas=grupos.map(x=>chaveMotivo(x.rotulo));
  const soltos=lista.filter(c=>chavesAgrupadas.indexOf(chaveMotivo(motivoPausa(c)))<0);
  return {grupos, soltos};
}

<script>
/* ============================================================
   7. NAVEGAÇÃO, FILTROS E BUSCA GLOBAL
   ============================================================ */
let VIEW='painel';
let F={busca:'',ka:'',tipo:'',status:'',erp:'',crm:'',farol:'',resp:'',flag:'',motivo:'',ativos:'',arquivados:false};
const VIEWS=[
 {id:'painel',ic:'▦',nome:'Painel',sub:'Visão executiva da carteira de onboarding'},
 {id:'prioridades',ic:'!',nome:'Prioridades de hoje',sub:'Clientes que exigem uma ação agora'},
 {id:'carteira',ic:'▤',nome:'Carteira',sub:'Todos os clientes, com filtros combináveis'},
 {id:'jornada',ic:'⬓',nome:'Jornada',sub:'Distribuição da carteira por etapa do onboarding'},
 {id:'alertas',ic:'◆',nome:'Alertas',sub:'O que mudou de estado e precisa de leitura'},
 {id:'indicadores',ic:'∿',nome:'Indicadores',sub:'Eficiência do onboarding e visão por KA'},
 {id:'dados',ic:'⛁',nome:'Dados',sub:'Origem, consistência e manutenção da base'}
];
function irPara(v,flag){ VIEW=v; if(flag!==undefined) F.flag=flag; render(); window.scrollTo(0,0); }

function filtrar(lista){
  const q=F.busca.trim().toLowerCase();
  return lista.filter(c=>{
    if(F.ka && c._ka!==F.ka) return false;
    if(F.tipo && c.tipo!==F.tipo) return false;
    if(F.status && c.status!==F.status) return false;
    if(F.erp && (c.erp||'—')!==F.erp) return false;
    if(F.crm && (c.crm||'—')!==F.crm) return false;
    if(F.farol && c._farol!==F.farol) return false;
    if(F.resp && !c._pend.some(p=>p.responsavel===F.resp)) return false;
    if(F.motivo && chaveMotivo(motivoPausa(c))!==chaveMotivo(F.motivo)) return false;
    if(F.ativos==='Clientes com 1 ativo' && c.totalAtivos>1) return false;
    if(F.ativos==='Clientes com vários ativos' && c.totalAtivos<2) return false;
    if(F.flag && !passaFlag(c,F.flag)) return false;
    if(q){
      const alvo=[c.cliente,c.ativoNome,c.obsOriginal,c.erp,c.crm,c._ka,c.tipo,c.status,c.razaoSocial,
        (c.atualizacoes||[]).map(a=>a.texto).join(' '),
        c._pend.map(p=>p.descricao+' '+(p.categoria||'')).join(' ')].join(' ').toLowerCase();
      if(alvo.indexOf(q)<0) return false;
    }
    return true;
  });
}
function passaFlag(c,f){
  const H=hojeISO();
  switch(f){
    case 'onboarding': return ['09 - Op. Ativa','10 - Entregue','11 - Distrato em negociação'].indexOf(c.status)<0;
    case 'handoff': return c.status.indexOf('01 -')===0;
    case 'kickoff': return c.status.indexOf('02 -')===0;
    case 'setup': return c.status.indexOf('03 -')===0;
    case 'migracao': return c.status.indexOf('05 -')===0;
    case 'assistida': return c.status.indexOf('07 -')===0;
    case 'op8': return c.status.indexOf('08 -')===0;
    case 'pausado': return c.status.indexOf('04 -')===0;
    case 'atraso': return c._farol==='vermelho'||c._farol==='critico';
    case 'critico': return c._farol==='critico';
    case 'aguardandoCliente': return c._aguardandoCliente;
    case 'aguardandoTrinus': return c._aguardandoTrinus;
    case 'slaVencido': return c._sla.tem && c._sla.atraso>0;
    case 'cobrancaHoje': return c._cobrancaHoje;
    case 'vencendoHoje': return c._pend.some(p=>p.prazo===H)||c._agendas.some(a=>a._sit==='hoje');
    case 'semAtualizacao': return c._semAtualizacao!==null && c._semAtualizacao>5 && !pausado(c);
    case 'csat': return normalizar(c.campos.csatEnvio).estado==='Pendente'||normalizar(c.campos.csatColeta).estado==='Pendente';
    case 'api': return c._pend.some(p=>p.categoria==='Integração');
    case 'agenda': return c._agendas.some(a=>a._sit==='vencida'||a._sit==='hoje');
    case 'pendencia': return c._pend.length>0;
    default: return true;
  }
}
const ROTULO_FLAG={onboarding:'em onboarding',handoff:'aguardando handoff',kickoff:'aguardando kickoff',setup:'em setup/documentação',
 migracao:'em migração/implantação',assistida:'em operação assistida',op8:'em operação ativa com pendência',pausado:'pausados',
 atraso:'em atraso',critico:'críticos',aguardandoCliente:'aguardando cliente',aguardandoTrinus:'aguardando áreas internas',
 slaVencido:'com SLA de documentação vencido',cobrancaHoje:'com cobrança prevista para hoje',vencendoHoje:'com atividade vencendo hoje',
 semAtualizacao:'sem atualização recente',csat:'com CSAT pendente',api:'com pendência de API',agenda:'com agenda pendente',pendencia:'com pendências abertas'};

/* ============================================================
   8. RENDERIZAÇÃO
   ============================================================ */
function render(){
  const base=todos(F.arquivados);
  document.getElementById('nav').innerHTML = VIEWS.map(v=>{
    let cnt='';
    if(v.id==='prioridades'){ const n=base.filter(c=>precisaAcao(c)).length; if(n) cnt='<span class="cnt alerta">'+n+'</span>'; }
    if(v.id==='alertas'){ const n=gerarAlertas(base).length; if(n) cnt='<span class="cnt">'+n+'</span>'; }
    return '<button class="nav-b '+(VIEW===v.id?'on':'')+'" onclick="irPara(\''+v.id+'\')"><span class="ic">'+v.ic+'</span>'+v.nome+cnt+'</button>';
  }).join('');
  const v=VIEWS.find(x=>x.id===VIEW);
  document.getElementById('tituloView').innerHTML=v.nome+'<small>'+v.sub+'</small>';
  document.getElementById('railInfo').textContent=baseClientes().length+' clientes · '+baseAtivos().length+' ativos · base de '+brLongo(DB.criadoEm);
  const el=document.getElementById('view');
  if(VIEW==='painel') el.innerHTML=viewPainel(base);
  else if(VIEW==='prioridades') el.innerHTML=viewPrioridades(base);
  else if(VIEW==='carteira') el.innerHTML=viewCarteira(base);
  else if(VIEW==='jornada') el.innerHTML=viewJornada(base);
  else if(VIEW==='alertas') el.innerHTML=viewAlertas(base);
  else if(VIEW==='indicadores') el.innerHTML=viewIndicadores(base);
  else el.innerHTML=viewDados(base);
}
function precisaAcao(c){
  if(c._farol==='vermelho'||c._farol==='critico') return true;
  if(c._cobrancaHoje) return true;
  if(c._agendas.some(a=>a._sit==='hoje'||a._sit==='vencida')) return true;
  if(pausaVencida(c)) return true;
  if(pausado(c)) return false;
  if(c._farol==='ambar') return true;
  return false;
}
const FAROL_NOME={verde:'Em dia',ambar:'Atenção',vermelho:'Atrasado',critico:'Crítico',pausado:'Pausado'};
function farolHTML(f){ return '<span class="farol f-'+f+'"><i></i>'+FAROL_NOME[f]+'</span>'; }

/* ---------- 8.4 Jornada (kanban com arraste) ---------- */

function kcard(c){

let ARRASTANDO=null;
function iniciarArraste(e,id){

}
function permitirSolta(e){ e.preventDefault(); e.dataTransfer.dropEffect='move'; e.currentTarget.classList.add('alvo'); }
function soltarCard(e,col){

function gerarAlertas(base){

  base.forEach(c=>{
    if(c._sla.tem && c._sla.atraso>0)
      A.push({n:'r',c:c,t:esc(c.cliente)+' — documentação atrasada há '+du(c._sla.atraso),s:'SLA venceu em '+br(c._sla.venc),o:100+c._sla.atraso});
    c._agendas.filter(a=>a._sit==='vencida').forEach(a=>
      A.push({n:'r',c:c,t:esc(c.cliente)+' — agenda com '+esc(a.area||'especialista')+' vencida',s:esc(a.tema||'')+' · prevista '+br(a.prevista),o:95}));
    if(pausaVencida(c)) A.push({n:'r',c:c,t:esc(c.cliente)+' — retomada vencida',s:'Prevista para '+br(c.pausa.retomada),o:94});
    c._pend.filter(p=>p._atraso>0 && !p.auto).forEach(p=>
      A.push({n:'r',c:c,t:esc(c.cliente)+' — '+esc(p.descricao),s:'Vencida há '+du(p._atraso)+' · '+esc(p.responsavel||''),o:90+p._atraso}));
    if(c._semAtualizacao!==null && c._semAtualizacao>10 && !pausado(c))
      A.push({n:'r',c:c,t:esc(c.cliente)+' — sem nenhum registro há '+du(c._semAtualizacao),s:'Último registro em '+br(ultimoRegistro(c)),o:80});
    else if(c._semAtualizacao!==null && c._semAtualizacao>5 && !pausado(c))
      A.push({n:'a',c:c,t:esc(c.cliente)+' — sem atualização há '+du(c._semAtualizacao),s:'Verificar andamento',o:50});
    if(c._cobrancaHoje) A.push({n:'a',c:c,t:esc(c.cliente)+' — cobrança prevista para hoje',s:'Cobrança nº '+((c.cobrancas||[]).length+1)+' da régua',o:70});
    if(c.datas.kickoffPrevisto && !c.datas.kickoffRealizado && diasUteis(H,c.datas.kickoffPrevisto)>=0 && diasUteis(H,c.datas.kickoffPrevisto)<=1)
      A.push({n:'a',c:c,t:esc(c.cliente)+' — kickoff previsto para '+br(c.datas.kickoffPrevisto),s:'Confirmar a agenda',o:65});
    c._agendas.filter(a=>a._sit==='hoje').forEach(a=>
      A.push({n:'b',c:c,t:esc(c.cliente)+' — agenda com '+esc(a.area||'especialista')+' hoje',s:esc(a.tema||''),o:60}));
    if(pausado(c) && c.pausa.retomada && diasUteis(H,c.pausa.retomada)>=0 && diasUteis(H,c.pausa.retomada)<=5)
      A.push({n:'b',c:c,t:esc(c.cliente)+' — retomada prevista para '+br(c.pausa.retomada),s:'Preparar reativação',o:40});
    if(c._pend.some(p=>p.id==='auto-op8'))
      A.push({n:'a',c:c,t:esc(c.cliente)+' — pendência de operação ativa sem detalhamento',s:'Registre qual pendência impede o encerramento',o:52});
    if(c._pend.some(p=>p.id==='auto-doc-sem-data'))
      A.push({n:'a',c:c,t:esc(c.cliente)+' — coleta de documentação sem data de solicitação',s:'Sem essa data o SLA não pode ser calculado',o:46});
    if(c.status.indexOf('01 -')===0)
      A.push({n:'a',c:c,t:esc(c.cliente)+' — handoff ainda não recebido',s:'Solicitar o handoff ao Comercial',o:58});
    if(c.status.indexOf('02 -')===0)
      A.push({n:'a',c:c,t:esc(c.cliente)+' — kickoff ainda não realizado',s:'Agendar o kickoff com o cliente',o:57});
    if(c._pend.some(p=>p.id==='auto-api'))
      A.push({n:'a',c:c,t:esc(c.cliente)+' — API não conectada com as credenciais já enviadas',s:'Acionar Sistemas',o:54});
    if(c.status.indexOf('08 -')===0 && c._diasNaEtapa!==null && c._diasNaEtapa>20)
      A.push({n:'a',c:c,t:esc(c.cliente)+' — '+du(c._diasNaEtapa)+' em operação ativa com pendência',s:'Condição não deve permanecer indefinidamente',o:55});
  });
  return A.sort((x,y)=>y.o-x.o);
}
function alertaHTML(a){

<script>
/* ============================================================
   9. INDICADORES DE EFICIÊNCIA E VISÃO POR KA
   Toda métrica declara a base de cálculo. Onde não há data
   registrada, a métrica não é estimada — é declarada indisponível.
   ============================================================ */
function media(vals){ const v=vals.filter(x=>x!==null&&x!==undefined&&!isNaN(x)); return v.length? Math.round(v.reduce((a,b)=>a+b,0)/v.length*10)/10 : null; }
function pct(a,b){ return b? Math.round(a/b*100) : null; }
function card(rot,val,sub,unid){
  return `<div class="c"><small>${rot}</small><b>${val===null?'—':val}${unid?' <span>'+unid+'</span>':''}</b><div class="sub">${sub}</div></div>`;
}
function viewIndicadores(base){
  const L=filtrar(base);
  const est=k=>c=>normalizar(c.campos[k]).estado;
  const comAmbas=(a,b)=>L.filter(c=>c.datas[a]&&c.datas[b]);
  const m=(a,b)=>{ const l=comAmbas(a,b); return {v:media(l.map(c=>diasUteis(c.datas[a],c.datas[b]))), n:l.length}; };
  const hk=m('handoff','kickoffRealizado'), kd=m('kickoffRealizado','docCompleta'),
        setup=m('docSolicitada','docCompleta'), impl=m('docCompleta','opAtivaEntrada'), total=m('handoff','opAtivaEntrada');
  const kickSla=L.filter(c=>c.datas.kickoffPrevisto&&c.datas.kickoffRealizado);
  const docSla=L.filter(c=>c.datas.docSolicitada&&c.datas.docCompleta);
  const aplic=k=>L.filter(c=>normalizar(c.campos[k]).estado!=='Não aplicável'&&normalizar(c.campos[k]).estado!=='Não informado');
  const okDe=k=>{ const a=aplic(k); return {p:pct(a.filter(c=>normalizar(c.campos[k]).estado==='Concluído').length,a.length), n:a.length}; };
  const cobs=L.map(c=>(c.cobrancas||[]).length);

      const cli=p.responsavel==='Cliente'; if((tipo==='cliente')===cli) ds.push(diasUteis(p.abertura,hojeISO())); })); return {v:media(ds),n:ds.length}; };
  const ec=espera('cliente'), ei=espera('interno');
  const pctC=(k)=>{ const r=okDe(k); return card(CAMPOS_LABEL[k],r.p,'base: '+r.n+' clientes aplicáveis','%'); };

  const kas=[...new Set(L.map(c=>c._ka))].sort();

  <div class="sec-tit">Tempo de ciclo — sempre em dias úteis</div>
  <div class="ind">

    ${card('Documentação concluída no SLA',pct(docSla.filter(c=>diasUteis(c.datas.docSolicitada,c.datas.docCompleta)<=SLA_DOC).length,docSla.length),'base: '+docSla.length+' coletas concluídas','%')}
    ${card('Média de cobranças por cliente',media(cobs),'base: '+L.length+' clientes','')}
    ${card('Clientes com 3 ou mais cobranças',cobs.filter(x=>x>=3).length,'régua de documentação','')}
  </div>
  <div class="sec-tit">Cobertura da jornada</div>
  <div class="ind">
    ${pctC('jornadaSucesso')}${pctC('apresentacaoPlataforma')}${pctC('acessoPlataforma')}
    ${pctC('apiConectada')}${pctC('csatEnvio')}${pctC('csatColeta')}
  </div>
  <div class="sec-tit">Tempo por etapa — a partir das movimentações registradas</div>
  <div class="bloco"><div class="bloco__b">
    ${(()=>{ const acc={};
      L.forEach(c=>(c.movimentacoes||[]).forEach(m=>{ if(m.permanencia===null||m.permanencia===undefined) return;
        (acc[m.de]=acc[m.de]||[]).push(m.permanencia); }));
      L.forEach(c=>{ if(c._diasNaEtapa!==null) (acc[c.status]=acc[c.status]||[]).push(c._diasNaEtapa); });
      const linhas=STATUS.filter(st=>acc[st]&&acc[st].length);
      if(!linhas.length) return '<div class="vazio"><b>Ainda sem base de cálculo</b>Mova clientes entre etapas no Kanban para o sistema medir o tempo de permanência.</div>';
      const max=Math.max(...linhas.map(st=>media(acc[st])));
      return linhas.map(st=>`<div style="margin-bottom:11px"><div style="display:flex;font-size:12.5px">
        <span>${esc(st)}</span><b style="margin-left:auto">${media(acc[st])} d.ú.</b>
        <span class="cli-sub" style="margin-left:10px">base: ${acc[st].length}</span></div>
        <div class="barra"><i style="width:${Math.round(media(acc[st])/max*100)}%"></i></div></div>`).join('');
    })()}
  </div></div>

  <div class="sec-tit">Gestão de carteira por KA</div>
  <div class="bloco"><div class="bloco__h"><h2>Distribuição por KA</h2><p>visão de carteira, não ranking</p></div>
  <div class="tab-wrap"><table class="t"><thead><tr><th>KA</th><th class="num">Clientes</th><th class="num">Em onboarding</th>
    <th class="num">Críticos</th><th class="num">Pend. abertas</th><th class="num">SLA vencido</th>
    <th class="num">Onboarding médio</th><th class="num">CSAT respondido</th><th>Status predominante</th></tr></thead><tbody>
    ${kas.map(k=>{ const l=L.filter(c=>c._ka===k);
      const dist={}; l.forEach(c=>dist[c.status]=(dist[c.status]||0)+1);
      const top=Object.entries(dist).sort((a,b)=>b[1]-a[1])[0];
      const csat=l.filter(c=>normalizar(c.campos.csatColeta).estado==='Concluído').length;
      return `<tr onclick="F.ka='${k}';irPara('carteira','')">
        <td><b>${esc(k)}</b></td><td class="num">${l.length}</td>
        <td class="num">${l.filter(c=>passaFlag(c,'onboarding')).length}</td>
        <td class="num">${l.filter(c=>c._farol==='critico').length}</td>
        <td class="num">${l.reduce((s,c)=>s+c._pend.length,0)}</td>

        <td class="num">${media(l.map(c=>c._diasOnboarding))??'—'}</td>
        <td class="num">${csat}</td>
        <td><span class="cli-sub">${esc(top?top[0]+' ('+top[1]+')':'—')}</span></td></tr>`; }).join('')}
  </tbody></table></div></div>`;
}

  const multi=baseClientes().filter(c=>c.ativos.length>1);
  const semStatus=base.filter(c=>!c.status);
  const semKA=base.filter(c=>!c.ka.trim()).length;
  return `
  <div class="bloco"><div class="bloco__h"><h2>Origem dos dados</h2></div><div class="bloco__b">

    <p style="margin:0;color:var(--tinta-2)">Tudo o que você registra aqui fica no navegador deste computador. Use a exportação para levar os dados para outra máquina ou para uma futura integração com Excel, SharePoint ou banco de dados.</p>
  </div></div>

  <div class="sec-tit">Pontos que pedem verificação na planilha</div>
  <div class="bloco">
    ${inc.length? inc.map(c=>`<div class="alerta" onclick="abrirCliente('${c.id}')"><span class="pt" style="background:var(--ambar)"></span>
      <span class="txt"><b>${esc(rotulo(c))}</b><span>${c.inconsistencias.map(esc).join(' · ')}${c.linhaPlanilha?' (linha '+c.linhaPlanilha+')':''}</span></span></div>`).join('')
     : '<div class="vazio">Nenhuma inconsistência estrutural encontrada.</div>'}
    ${SEED.orfaosDatas.length? `<div class="alerta"><span class="pt" style="background:var(--azul)"></span><span class="txt">
