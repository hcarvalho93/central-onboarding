      <b>${multi.length} clientes com mais de um ativo</b>
      <span>${multi.map(c=>esc(c.cliente)+' ('+c.ativos.length+')').join(' · ')} — linhas com o mesmo nome foram consolidadas em um único cliente. Renomeie os ativos na tela do cliente.</span></span></div>`:''}
    ${semStatus.length?`<div class="alerta"><span class="pt" style="background:var(--ambar)"></span><span class="txt">
      <b>${semStatus.length} ativo(s) sem status oficial na planilha</b>
      <span>${semStatus.map(c=>esc(rotulo(c))).join(' · ')} — defina o status para que entrem no cálculo de jornada.</span></span></div>`:''}
    <div class="alerta"><span class="pt" style="background:var(--azul)"></span><span class="txt">
      <b>${semDatas} ativos sem nenhuma data operacional registrada</b>
      <span>Enquanto não houver data de handoff, kickoff ou solicitação de documentação, o SLA desses clientes não pode ser calculado.</span></span></div>
    ${semKA?`<div class="alerta"><span class="pt" style="background:var(--ambar)"></span><span class="txt">
      <b>${semKA} clientes sem KA definido na planilha</b><span>Aparecem agrupados como “Sem KA”.</span></span></div>`:''}
  </div>

  <div class="sec-tit">Feriados considerados no cálculo de dias úteis</div>
  <div class="bloco"><div class="bloco__b">
    <p style="margin:0 0 10px;color:var(--tinta-2)">Sábados e domingos já são desconsiderados. Cadastre aqui feriados nacionais e corporativos, um por linha, no formato AAAA-MM-DD.</p>
    <textarea id="feriados" class="saida" style="min-height:110px">${(DB.feriados||[]).join('\n')}</textarea>
    <div style="margin-top:10px"><button class="btn btn--p" onclick="salvarFeriados()">Salvar feriados</button></div>

  <div class="sec-tit">Manutenção</div>

    <button class="btn" onclick="exportarJSON()">Exportar tudo (JSON)</button>

    <button class="btn" onclick="limparTudo()" style="color:var(--vermelho);border-color:#F0C7CF">Apagar registros operacionais</button>
  </div></div>`;

function salvarFeriados(){
  const l=document.getElementById('feriados').value.split('\n').map(s=>s.trim()).filter(s=>/^\d{4}-\d{2}-\d{2}$/.test(s));
  DB.feriados=[...new Set(l)].sort(); salvar(); toast(DB.feriados.length+' feriado(s) salvos'); render();
}
function limparTudo(){
  if(!confirm('Isso apaga datas, pendências, agendas e histórico registrados nesta aplicação. Os dados originais da planilha permanecem. Continuar?')) return;
  DB={clientes:{},criadoEm:hojeISO(),feriados:DB.feriados}; carregar(); render(); toast('Registros operacionais apagados');
}

function timeline(c){
  const d=c.datas, idx=ETAPA_POR_STATUS[c.status];
  const marcos=[d.handoff, d.kickoffRealizado, d.checklistConcluido||d.docSolicitada, d.docCompleta,
                d.opAtivaEntrada&&d.docCompleta?d.docCompleta:null, d.apresentacaoPlataforma, d.assistidaInicio, d.opAtivaEntrada];
  return `<div class="timeline">${ETAPAS.map((e,i)=>{
    const feito = !!marcos[i] || (idx>=0 && i<idx);
    const atual = idx===i || (idx===3&&i===2);
    let cls = feito?'ok':(atual?'now':'');
    if(atual && (c._farol==='vermelho'||c._farol==='critico')) cls='late';
    const ic = cls==='ok'?'✓':cls==='late'?'⚠':cls==='now'?'●':'○';
    return `<div class="tl ${cls}"><div class="bola">${ic}</div><small>${e}</small><div class="dt">${marcos[i]?br(marcos[i]):''}</div></div>`;
  }).join('')}</div>`;
}

function abrirModal(titulo, corpoHTML, botoes){
  document.getElementById('modalT').textContent=titulo;
  document.getElementById('modalB').innerHTML=corpoHTML;
  document.getElementById('modalF').innerHTML=botoes;
  document.getElementById('modal').classList.add('on');
}
function fecharModal(){ document.getElementById('modal').classList.remove('on'); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on'); setTimeout(()=>t.classList.remove('on'),2600); }
function campoHTML(f){
  const v=f.valor==null?'':f.valor;
  if(f.tipo==='select') return `<div class="campo" style="margin-bottom:11px"><label>${f.label}</label><select id="f_${f.id}">
    ${(f.opcoes||[]).map(o=>`<option ${String(v)===String(o)?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`;
  if(f.tipo==='textarea') return `<div class="campo" style="margin-bottom:11px"><label>${f.label}</label><textarea id="f_${f.id}" style="min-height:74px">${esc(v)}</textarea></div>`;
  if(f.tipo==='check') return `<div class="campo" style="margin-bottom:11px;flex-direction:row;align-items:center;gap:8px">
    <input type="checkbox" id="f_${f.id}" ${v?'checked':''} style="width:auto"><label for="f_${f.id}" style="font-size:13px">${f.label}</label></div>`;
  return `<div class="campo" style="margin-bottom:11px"><label>${f.label}</label><input type="${f.tipo||'text'}" id="f_${f.id}" value="${esc(v)}" placeholder="${esc(f.dica||'')}"></div>`;
}
let SALVAR_MODAL=null;
function form(titulo, campos, onSave, rotulo){
  abrirModal(titulo, campos.map(campoHTML).join(''),
    `<button class="btn" onclick="fecharModal()">Cancelar</button><button class="btn btn--p" onclick="SALVAR_MODAL()">${rotulo||'Salvar'}</button>`);
  SALVAR_MODAL=function(){
    const v={}; campos.forEach(f=>{ const el=document.getElementById('f_'+f.id); if(!el) return;
      v[f.id]= f.tipo==='check'? el.checked : el.value.trim(); });
    onSave(v); fecharModal();
  };
}
function historico(tipo,texto,data){ const r=reg(CLI); r.historico.push({data:data||hojeISO(),tipo,texto:texto||''}); }

function editarPendencia(i){
  const r=reg(CLI); const p = i>=0 ? r.pendencias[i] : {abertura:hojeISO(),impacto:'médio',responsavel:'Cliente',status:'aberta',cobrancas:0};
  form(i>=0?'Editar pendência':'Nova pendência',[
    {id:'titulo',label:'Título',valor:p.titulo,dica:'resumo curto'},
    {id:'descricao',label:'Descrição',valor:p.descricao,dica:'O que exatamente está pendente'},
    {id:'categoria',label:'Categoria',valor:p.categoria,dica:'Documentação, Integração, Acessos…'},
    {id:'responsavel',label:'Responsabilidade da pendência',tipo:'select',opcoes:RESPONSAVEIS,valor:p.responsavel},
    {id:'origem',label:'Origem',valor:p.origem,dica:'Reunião, e-mail, kickoff…'},

/* ============================================================
   13. GERADOR DE MENSAGEM DE COBRANÇA
   Regra obrigatória: usa exclusivamente pendências abertas com
   responsabilidade = Cliente E marcadas como comunicáveis.
   Nunca expõe assunto interno, nome de colaborador, problema de
   parametrização, conflito entre áreas ou observação confidencial.
   ============================================================ */
function itensComunicaveis(c){
  const l = c._pend.filter(p=>p.status!=='concluída' && p.responsavel==='Cliente' && p.podeComunicar===true);
  const especificos = l.filter(p=>p.id!=='auto-doc');   // o item genérico da régua não duplica itens específicos
  return especificos.length ? especificos : l;
}
function textoParaCliente(p){ return p.textoCliente || p.descricao; }
function minusculaInicial(s){ s=String(s).trim(); return s.charAt(0).toLowerCase()+s.slice(1); }
function capitalizar(s){ s=String(s).trim(); return s.charAt(0).toUpperCase()+s.slice(1); }
function copiar(id){
  const el=document.getElementById(id); el.select(); el.setSelectionRange(0,999999);
  try{ document.execCommand('copy'); toast(id==='msgTexto'?'Mensagem copiada.':'Copiado'); }
  catch(e){ toast('Selecione e copie manualmente'); }
}
function copiarResumo(){
  const c=analisar(cliente(CLI));
  const t=[rotulo(c), (c.status||SEM_STATUS)+' · '+c._ka+' · '+c.tipo,
    'Farol: '+FAROL_NOME[c._farol]+' · score '+c._score,
    c._diasOnboarding!==null?'Em onboarding há '+du(c._diasOnboarding):'Sem data de início registrada',
    'Próxima ação: '+c._acao+' ('+c._acaoResp+')',
    c._pend.length? 'Pendências abertas:\n'+c._pend.map(p=>'• '+p.descricao+' — '+(p.responsavel||'a definir')+(p._atraso>0?' (atraso de '+du(p._atraso)+')':'')).join('\n') : 'Sem pendências abertas.',
    c._sla.tem? 'Documentação solicitada em '+brLongo(c._sla.solicitada)+', SLA até '+brLongo(c._sla.venc)+(c._sla.atraso>0?', atraso de '+du(c._sla.atraso):'') : ''
  ].filter(Boolean).join('\n');
  abrirModal('Resumo do cliente', `<textarea class="saida" id="resOut">${esc(t)}</textarea>`,
    `<button class="btn" onclick="fecharModal()">Fechar</button><button class="btn btn--p" onclick="copiar('resOut')">Copiar</button>`);
}

/* ============================================================
   14. RESUMO AUTOMÁTICO DA CARTEIRA PARA A LIDERANÇA
   Construído apenas com o que está registrado. Sem estimativas.
   ============================================================ */
function gerarResumo(){
  const b=todos(), on=b.filter(c=>passaFlag(c,'onboarding'));
  const verde=on.filter(c=>c._farol==='verde').length, amb=on.filter(c=>c._farol==='ambar').length,
        verm=on.filter(c=>c._farol==='vermelho').length, crit=on.filter(c=>c._farol==='critico').length,
        paus=on.filter(c=>c._farol==='pausado').length;
  const cat={}; on.forEach(c=>c._pend.forEach(p=>{ const k=p.categoria||'Outros'; cat[k]=(cat[k]||0)+1; }));
  const top=Object.entries(cat).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0].toLowerCase());
  const aguardCli=on.filter(c=>c._aguardandoCliente).length, aguardInt=on.filter(c=>c._aguardandoTrinus).length;
  const acoes=b.filter(precisaAcao).length, cob=b.filter(c=>c._cobrancaHoje).length;
  const semData=on.filter(c=>!c.datas.handoff&&!c.datas.docSolicitada&&!c.datas.kickoffRealizado).length;
  const L=[];
  L.push(on.length+' clientes estão atualmente em onboarding, de um total de '+b.length+' na carteira.');
  L.push(verde+' estão em dia, '+amb+' em atenção, '+verm+' com atraso e '+crit+' em situação crítica'+(paus?'. Outros '+paus+' estão oficialmente pausados, com o relógio de SLA suspenso':'')+'.');
  if(top.length) L.push('Os principais gargalos estão concentrados em '+top.join(', ')+'.');
  L.push('Existem '+aguardCli+' clientes aguardando ação do próprio cliente e '+aguardInt+' aguardando áreas internas da Trinus.');
  L.push('Hoje existem '+acoes+' clientes na fila de prioridade e '+cob+' cobranças previstas.');
  if(semData) L.push('Ressalva de base: '+semData+' clientes em onboarding ainda não possuem nenhuma data operacional registrada, o que impede o cálculo de SLA para esse grupo.');
  abrirModal('Resumo da carteira · '+brLongo(hojeISO()),
    `<textarea class="saida" id="carOut" style="min-height:250px">${esc(L.join('\n\n'))}</textarea>
     <div class="nota">Gerado a partir dos registros existentes. Nenhum número foi estimado.</div>`,
    `<button class="btn" onclick="fecharModal()">Fechar</button><button class="btn btn--p" onclick="copiar('carOut')">Copiar</button>`);
}

  abrirModal('Como o farol e o score são calculados', `
  <div style="font-size:13px;line-height:1.65">
    <p><b>Farol operacional</b> — independente do status oficial do cliente.</p>
    <p>🟢 <b>Em dia</b>: nenhuma atividade vencida.<br>
       🟡 <b>Atenção</b>: algo vence em até 2 dias úteis, existe dependência relevante sem conclusão, o cliente está há mais de 5 dias úteis sem registro, ou está em operação ativa com pendência.<br>
       🔴 <b>Atrasado</b>: pelo menos uma atividade vencida.<br>
       🔴 <b>Crítico</b>: score 10 ou mais, atraso acima de 10 dias úteis, três ou mais atividades vencidas, pendência bloqueadora, mais de 10 dias úteis sem qualquer registro, ou operação ativa com pendência já vencida.<br>
       ⏸ <b>Pausado</b>: o relógio de SLA fica suspenso. O cliente só volta à fila se a data de retomada vencer.</p>
    <p><b>Score de prioridade operacional</b> = atraso + impacto + bloqueio + recorrência.</p>

       Bloqueio de outra etapa: +3. Três ou mais cobranças: +2.<br>

function baixar(nome, conteudo, tipo){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([conteudo],{type:tipo})); a.download=nome; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}
function exportarJSON(){
  baixar('onboarding-trinus-'+hojeISO()+'.json', JSON.stringify({versao:1,seed:SEED,operacional:DB},null,1), 'application/json');
  toast('Arquivo exportado');
}
function importarJSON(inp){
  const f=inp.files[0]; if(!f) return;
  const fr=new FileReader();
  fr.onload=()=>{ try{ const j=JSON.parse(fr.result);
      if(!j.operacional) throw new Error('Arquivo sem a camada operacional');
      DB=j.operacional; carregar(); render(); toast('Dados importados');
    }catch(e){ toast('Não foi possível importar: '+e.message); } inp.value=''; };
  fr.readAsText(f);
}
function exportarCSV(){
  const l=filtrar(todos());
  const cab=['Cliente','Tipo','KA','Status','ERP','CRM','Farol','Score','Dias na etapa','Dias em onboarding',
    'Principal pendência','Responsável','Próxima ação','Próxima cobrança','SLA vencido (d.ú.)','Observação original'];
  const linhas=l.map(c=>[c.cliente,c.tipo,c._ka,c.status,c.erp,c.crm,FAROL_NOME[c._farol],c._score,
    c._diasNaEtapa??'',c._diasOnboarding??'', c._principal?c._principal.descricao:'', c._principal?(c._principal.responsavel||''):'',
    c._acao, c._sla.proximaCobranca||'', c._sla.atraso||0, c.obsOriginal]);
  const csv=[cab].concat(linhas).map(r=>r.map(x=>'"'+String(x==null?'':x).replace(/"/g,'""')+'"').join(';')).join('\n');
  baixar('carteira-onboarding-'+hojeISO()+'.csv', '\ufeff'+csv, 'text/csv;charset=utf-8');
  toast('CSV exportado');
}

function confirmarMovimentacao(id, novo, voltarSelect){
  const c=cliente(id); if(!c || c.status===novo){ if(voltarSelect) atualizarCliente(); return; }
  const av=checarCoerencia(c, novo);
  const corpo=`<p>Mover <b>${esc(c.cliente)}</b> de <b>${esc(c.status)}</b> para <b>${esc(novo)}</b>?</p>
    ${av.length?`<div class="aviso"><b>Atenção:</b><br>${av.map(esc).join('<br>')}<br><br>
      Você pode mover mesmo assim — a exceção fica registrada no histórico.</div>`:''}
    <div class="campo"><label>Observação da movimentação (opcional)</label><input type="text" id="movObs"></div>`;
  abrirModal('Alterar etapa', corpo,
    `<button class="btn" onclick="cancelarMovimentacao()">Cancelar</button>
     <button class="btn ${av.length?'':'btn--p'}" onclick="executarMovimentacao('${id}','${esc(novo).replace(/'/g,"\\\\'")}',${av.length})">
       ${av.length?'Mover mesmo assim':'Confirmar'}</button>`);
}
function cancelarMovimentacao(){ fecharModal(); if(CLI) atualizarCliente(); else render(); }
function executarMovimentacao(id, novo, excecao){
  const el=document.getElementById('movObs');
  moverEtapa(id, novo, el?el.value.trim():'', !!excecao);

  if(CLI) abrirCliente(id);

/* ============================================================
   21. MODELOS DE COMUNICAÇÃO
   Todo texto é montado com os dados reais do cliente. Nenhum
   assunto interno entra: só pendências do cliente liberadas
   para comunicação.
   ============================================================ */
const MODELOS=[
  {id:'cobranca',  nome:'Cobrança de documentação'},
  {id:'primeira',  nome:'Primeira solicitação'},
  {id:'recorrente',nome:'Cobrança recorrente'},
  {id:'kickoff',   nome:'Confirmação de kickoff'},
  {id:'agenda',    nome:'Confirmação de agenda com especialista'},
  {id:'acesso',    nome:'Solicitação de acesso'},
  {id:'api',       nome:'Cobrança de API'},
  {id:'ausencia',  nome:'Retorno após ausência do cliente'},
  {id:'csat',      nome:'Solicitação de CSAT'},
  {id:'retomada',  nome:'Retomada de onboarding pausado'}
];
function saudacao(nome){ return nome? 'Olá, '+nome+'! Tudo bem?' : 'Olá! Tudo bem?'; }
/** Lista em tópicos, sempre isolada do texto corrido. */
function listaItens(itens){
  return '\n\n'+itens.map((p,i)=>'• '+capitalizar(textoParaCliente(p))+(i===itens.length-1?'.':';')).join('\n')+'\n';
}
function itemInline(itens){ return itens.length? minusculaInicial(textoParaCliente(itens[0])) : ''; }
function trechoPrazo(itens, sla, um){
  const at = Math.max((sla&&sla.atraso)||0, itens.reduce((m,p)=>Math.max(m,p._atraso||0),0));
  if(!at) return '';
  return '\n'+(um?'Esse ponto está':'Esses pontos estão')+' pendente'+(um?'':'s')+' há '+du(at)+
    ' e, neste momento, impacta'+(um?'':'m')+' diretamente a continuidade da implantação.\n';
}
/** Monta o texto conforme modelo, escopo, destinatário e nível de cobrança. */
function montarTexto(c, opts){
  const S = saudacao(opts.nome||'');
  const cli = c.cliente + (c.totalAtivos>1 ? ' — '+c.ativoNome : '');
  const itens = opts.itens||[];
  const um = itens.length===1;
  const L = itens.length? listaItens(itens) : '';
  const X = itemInline(itens);
  const n = (c.cobrancas||[]).length;          // cobranças registradas definem o tom
  const prazo = opts.prazo? trechoPrazo(itens, c._sla, um) : '';
  switch(opts.modelo){
    case 'primeira':
      return S+'\n\nEstamos iniciando o onboarding da '+cli+' e, para avançarmos com as próximas etapas, precisamos '+
        (um? 'de um ponto: '+X+'.' : 'dos seguintes itens:'+L)+prazo+
        '\nO prazo previsto para esse retorno é de '+SLA_DOC+' dias úteis. Se precisar de apoio em algum item, fico à disposição.';
    case 'recorrente':
      return S+'\n\nSeguimos aguardando '+(um?'o item abaixo, já solicitado anteriormente':'os itens abaixo, já solicitados anteriormente')+':'+L+prazo+
        '\nNeste momento, '+(um?'essa pendência está impedindo':'essas pendências estão impedindo')+
        ' o avanço das próximas etapas do onboarding da '+cli+'. Consegue nos ajudar a destravar '+(um?'esse ponto':'esses pontos')+'?';
    case 'kickoff':
      return S+'\n\nPassando para confirmar o kickoff do onboarding da '+cli+
        (c.datas.kickoffPrevisto?', previsto para '+brLongo(c.datas.kickoffPrevisto):'')+'.'+
        '\n\nNesse encontro vamos apresentar a jornada de implantação, alinhar responsabilidades e combinar os próximos passos.'+
        '\n\nA data e o horário seguem confirmados para vocês?';
    case 'agenda': {
      const ag=(c._agendas||[]).filter(a=>!a.realizada).sort((a,b)=>String(a.prevista).localeCompare(String(b.prevista)))[0];
      return S+'\n\nPassando para confirmar nossa agenda'+(ag&&ag.area?' com o time de '+ag.area:' com o especialista')+
        (ag&&ag.prevista?', prevista para '+brLongo(ag.prevista):'')+'.'+
        (ag&&ag.tema?'\n\nPauta: '+ag.tema+'.':'')+
        '\n\nPodem confirmar a participação?';
    }
    case 'acesso':
      return S+'\n\nPara seguirmos com a parametrização da '+cli+', precisamos da liberação '+
        (um? 'de: '+X+'.' : 'dos acessos abaixo:'+L)+prazo+
        '\nEsses acessos são o que permite ao nosso time operar dentro do sistema de vocês.';
    case 'api':
      return S+'\n\nEstamos na etapa de integração da '+cli+' e precisamos concluir a conexão da API.'+
        '\n\nPara isso, ainda dependemos do envio das credenciais e da confirmação dos usuários habilitados.'+prazo+
        '\nAssim que recebermos, nosso time segue com a conexão.';
    case 'ausencia':
      return S+'\n\nRetomo o contato sobre o onboarding da '+cli+'. Ficamos sem retorno nos últimos dias e queremos entender como podemos ajudar a destravar os próximos passos.'+
        (itens.length? '\n\nDo nosso lado, seguimos aguardando:'+L : '\n\n')+
        'Se fizer sentido, podemos marcar uma conversa rápida para alinhar as prioridades.';
    case 'csat':
      return S+'\n\nChegamos a um marco importante do onboarding da '+cli+' e queremos muito ouvir vocês.'+
        '\n\nSeria possível responder nossa pesquisa rápida de satisfação? Leva menos de dois minutos e ajuda a ajustar o que for necessário no atendimento.'+
        '\n\nObrigada pelo apoio!';
    case 'retomada':
      return S+'\n\nO onboarding da '+cli+' está pausado desde '+(c.pausa&&c.pausa.data?brLongo(c.pausa.data):'a última definição')+
        (c.pausa&&c.pausa.motivoCurto?' em razão de '+c.pausa.motivoCurto.toLowerCase():'')+'.'+
        (c.pausa&&c.pausa.retomada?'\n\nA retomada estava prevista para '+brLongo(c.pausa.retomada)+'.':'')+
        '\n\nPodemos retomar os trabalhos? Assim que confirmarem, reorganizamos o cronograma e seguimos com as próximas etapas.';
    default: {   // cobrança de documentação — tom conforme o número de cobranças já registradas
      if(n===0)
        return S+'\n\nPara seguirmos com as próximas etapas do onboarding da '+cli+', ainda '+
          (um? 'precisamos de um ponto: '+X+'.' : 'precisamos concluir alguns pontos:'+L)+prazo+
          '\n'+(um?'Esse item é importante':'Esses itens são importantes')+
          ' para avançarmos com a parametrização e mantermos o cronograma previsto.\n\nSe precisar de apoio, fico à disposição.';
      if(n===1)
        return S+'\n\nRetomo o contato sobre '+(um?'o item abaixo, ainda pendente':'os itens abaixo, ainda pendentes')+
          ' no onboarding da '+cli+':'+L+prazo+
          '\n'+(um?'Esse ponto é o que hoje mantém':'Esses pontos são o que hoje mantém')+
          ' o cronograma parado. Consegue nos dar um retorno sobre o prazo de envio?';
      return S+'\n\nSeguimos aguardando '+(um?'o item abaixo, já solicitado anteriormente':'os itens abaixo, já solicitados anteriormente')+':'+L+prazo+
        '\nNeste momento, '+(um?'essa pendência está impedindo':'essas pendências estão impedindo')+
        ' o avanço das próximas etapas do onboarding da '+cli+
        '. Preciso de um retorno sobre quando conseguiremos '+(um?'recebê-lo':'recebê-las')+
        ' para reorganizarmos o cronograma com vocês.';
    }
  }
}
function gerarMensagem(){
  const c=analisar(cliente(CLI));
  let itens=itensComunicaveis(c);
  if(MSG_CFG.escopo==='individual'){
    const i=parseInt(MSG_CFG.pendencia||'0',10);
    itens = itens[i]? [itens[i]] : itens.slice(0,1);
  }
  const precisaItens=['cobranca','primeira','recorrente','acesso'].indexOf(MSG_CFG.modelo)>=0;
  if(precisaItens && !itens.length){
    const soCliente=c._pend.filter(p=>p.responsavel==='Cliente');
    document.getElementById('msgTexto').value =
      soCliente.length
      ? 'Nenhum item está liberado para comunicação.\n\nExistem '+soCliente.length+' pendência(s) sob responsabilidade do cliente, mas nenhuma marcada como “pode ser comunicada ao cliente”. Abra a pendência e marque essa opção para incluí-la na mensagem.'
      : 'Não há pendência aberta sob responsabilidade do cliente.\n\nPendências internas da Trinus nunca entram na mensagem enviada ao cliente.';
    toast('Nenhum item liberado para comunicação'); return;
  }
  const k = MSG_CFG.contato!==''? (c.contatos||[])[parseInt(MSG_CFG.contato,10)] : null;
  const nome = k? String(k.nome).split(' ')[0] : '';
  document.getElementById('msgTexto').value = montarTexto(c, {modelo:MSG_CFG.modelo, itens, nome, prazo:MSG_CFG.prazo});
  toast('Mensagem gerada');
}

    if(document.getElementById('modal').classList.contains('on')) fecharModal();
